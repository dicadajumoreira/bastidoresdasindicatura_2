          D: 'Assumir toda a condução sozinho.',
          E: 'Ler normas e documentos para fundamentar cada decisão.',
          F: 'Conduzir o debate com método e objetivo.',
        },
      },
      {
        n: 3,
        text: 'Qual frase mais parece com você?',
        opts: {
          A: '"Todo dia aparece uma bomba nova."',
          B: '"Não quero criar atritos."',
          C: '"Se não for firme, ninguém respeita."',
          D: '"É mais fácil eu fazer sozinho."',
          E: '"Tudo precisa estar documentado."',
          F: '"O que não é planejado vira problema."',
        },
      },
      {
        n: 4,
        text: 'Como você delega tarefas?',
        opts: {
          A: 'Delego apenas quando estou sobrecarregado.',
          B: 'Delego tentando não desagradar ninguém.',
          C: 'Delego cobrando com firmeza.',
          D: 'Quase nunca delego.',
          E: 'Delego através de processos e registros.',
          F: 'Delego com acompanhamento e indicadores.',
        },
      },
      {
        n: 5,
        text: 'Quando recebe uma crítica de morador:',
        opts: {
          A: 'Tento resolver imediatamente.',
          B: 'Tento fazer a pessoa sair satisfeita.',
          C: 'Respondo de forma firme para mostrar autoridade.',
          D: 'Carrego o problema sozinho.',
          E: 'Procuro documentos para justificar minha decisão.',
          F: 'Analiso se a crítica faz sentido e tomo medidas.',
        },
      },
      {
        n: 6,
        text: 'Como está seu WhatsApp?',
        opts: {
          A: 'Um plantão permanente de emergências.',
          B: 'Conversas intermináveis tentando mediar conflitos.',
          C: 'Muitas cobranças e advertências.',
          D: 'Tudo passa por mim.',
          E: 'Mensagens arquivadas e organizadas.',
          F: 'Ferramenta de gestão, não de sobrevivência.',
        },
      },
      {
        n: 7,
        text: 'Sua relação com o conselho costuma ser:',
        opts: {
          A: 'Procuram você quando há crise.',
          B: 'Você tenta agradar todos os conselheiros.',
          C: 'Você costuma confrontar quando discordam.',
          D: 'Evita dividir decisões importantes.',
          E: 'Compartilha documentos e relatórios.',
          F: 'Trabalha alinhamento, estratégia e governança.',
        },
      },
      {
        n: 8,
        text: 'O que mais tira seu sono?',
        opts: {
          A: 'Problemas inesperados.',
          B: 'Moradores insatisfeitos.',
          C: 'Perder autoridade.',
          D: 'Não conseguir dar conta de tudo.',
          E: 'Falta de documentação.',
          F: 'Falta de planejamento de longo prazo.',
        },
      },
      {
        n: 9,
        text: 'Como você mede uma gestão de sucesso?',
        opts: {
          A: 'Conseguir sobreviver ao dia.',
          B: 'Ter poucos conflitos.',
          C: 'Ter controle da operação.',
          D: 'Resolver tudo pessoalmente.',
          E: 'Ter tudo registrado corretamente.',
          F: 'Gerar resultados sustentáveis e previsíveis.',
        },
      },
      {
        n: 10,
        text: 'Se pudesse melhorar uma habilidade hoje seria:',
        opts: {
          A: 'Organização.',
          B: 'Coragem para enfrentar conflitos.',
          C: 'Comunicação.',
          D: 'Delegação.',
          E: 'Relacionamento com moradores.',
          F: 'Continuar evoluindo e escalando resultados.',
        },
      },
    ];

    const PERFIS = {
      A: {
        nome: 'Bombeiro',
        eyebrow: 'Vol. 12 · Série Arquétipos',
        titulo: 'O Bombeiro.',
        subtitulo: 'Você vive apagando incêndios.',
        lead: 'Sua gestão gira em torno de urgência, reclamação e crise. Você trabalha muito, mas frequentemente sente que não sai do lugar.',
        risco: 'Virar refém dos problemas.',
        proximo: 'Criar processos, indicadores e planejamento.',
        pdfUrl: '/bombeiro/material.pdf',
        landingUrl: '/bombeiro/',
        origem: 'bombeiro',
      },
      B: {
        nome: 'Político',
        eyebrow: 'Vol. 13 · Série Arquétipos',
        titulo: 'O Político.',
        subtitulo: 'Você quer manter a paz a qualquer custo.',
        lead: 'Busca consenso, evita atrito e tenta agradar todos os lados. O preço dessa busca é a sua autoridade.',
        risco: 'Perder autoridade.',
        proximo: 'Aprender a dizer não e sustentar decisões impopulares.',
        pdfUrl: '/politico/material.pdf',
        landingUrl: '/politico/',
        origem: 'politico',
      },
      C: {
        nome: 'Sargento',
        eyebrow: 'Vol. 17 · Série Arquétipos',
        titulo: 'O Sargento.',
        subtitulo: 'Você lidera pela força.',
        lead: 'Tem firmeza e coragem pra decidir, mas pode gerar desgaste desnecessário. Obediência sem confiança tem prazo de validade.',
        risco: 'Confundir respeito com medo.',
        proximo: 'Desenvolver comunicação estratégica.',
        pdfUrl: '/sargento/material.pdf',
        landingUrl: '/sargento/',
        origem: 'sargento',
      },
      D: {
        nome: 'Solitário',
        eyebrow: 'Vol. 14 · Série Arquétipos',
        titulo: 'O Solitário.',
        subtitulo: 'Você carrega o condomínio nas costas.',
        lead: 'Resolve tudo sozinho porque acredita que ninguém fará tão bem quanto você. No começo é bom. Aí cansa. Aí adoece.',
        risco: 'Burnout.',
        proximo: 'Aprender delegação e construção de equipe.',
        pdfUrl: '/solitario/material.pdf',
        landingUrl: '/solitario/',
        origem: 'solitario',
      },
      E: {
        nome: 'Burocrata',
        eyebrow: 'Vol. 15 · Série Arquétipos',
        titulo: 'O Burocrata.',
        subtitulo: 'Você domina processo e documento.',
        lead: 'Sua gestão é organizada, mas muitas vezes as pessoas não entendem o que está sendo feito. Informar não é a mesma coisa que comunicar.',
        risco: 'Comunicação insuficiente.',
        proximo: 'Transformar informação técnica em conexão com moradores.',
        pdfUrl: '/burocrata/material.pdf',
        landingUrl: '/burocrata/',
        origem: 'burocrata',
      },
      F: {
        nome: 'Estrategista',
        eyebrow: 'Vol. 16 · Série Arquétipos',
        titulo: 'O Estrategista.',
        subtitulo: 'Você administra olhando presente e futuro.',
        lead: 'Consegue equilibrar pessoa, processo, finança e posicionamento. Não apenas resolve problema. Evita que ele aconteça.',
        risco: 'Acomodar no que já funciona.',
        proximo: 'Escalar sua liderança e influenciar mais pessoas.',
        pdfUrl: '/estrategista/material.pdf',
        landingUrl: '/estrategista/',
        origem: 'estrategista',
      },
    };

    const UFS = ['AC','AL','AP','AM','BA','CE','DF','ES','GO','MA','MT','MS','MG','PA','PB','PR','PE','PI','RJ','RN','RS','RO','RR','SC','SP','SE','TO'];

    const QuizApp = () => {
      // step: 'welcome' | 'question' | 'form' | 'submitting' | 'result'
      const [step, setStep] = React.useState('welcome');
      const [qIdx, setQIdx] = React.useState(0); // 0..9
      const [answers, setAnswers] = React.useState({}); // {1: 'A', 2: 'B', ...}
      const [form, setForm] = React.useState(() => {
        const defaults = {nome:'', cidade:'', estado:'', whatsapp:'', email:'', instagram:'', atuacao:'', data_nascimento:''};
        try {
          const saved = JSON.parse(localStorage.getItem('bs-lead') || '{}');
          return {...defaults, ...Object.fromEntries(Object.entries(saved).filter(([k]) => k in defaults))};
        } catch { return defaults; }
      });
      const [error, setError] = React.useState('');
      const [perfil, setPerfil] = React.useState(null);

      const totalQ = QUESTIONS.length;
      const progressPct = step === 'welcome' ? 0
        : step === 'question' ? Math.round(((qIdx) / (totalQ + 1)) * 100)
        : step === 'form' ? Math.round((totalQ / (totalQ + 1)) * 100)
        : 100;

      const start = () => setStep('question');

      const pickAnswer = (letra) => {
        const q = QUESTIONS[qIdx];
        setAnswers((a) => ({...a, [q.n]: letra}));
        // auto-advance after small delay
        setTimeout(() => {
          if (qIdx < totalQ - 1) setQIdx(qIdx + 1);
          else setStep('form');
        }, 220);
      };

      const goBack = () => {
        if (qIdx > 0) setQIdx(qIdx - 1);
      };

      const setField = (k, v) => setForm((f) => ({...f, [k]: v}));

      const canSendForm = form.nome && form.cidade && form.estado && form.whatsapp && form.email && form.instagram && form.atuacao && form.data_nascimento;

      const calcPerfil = () => {
        const counts = {A:0, B:0, C:0, D:0, E:0, F:0};
        Object.values(answers).forEach((l) => { counts[l] = (counts[l] || 0) + 1; });
        // ordem de desempate: F > E > C > B > D > A (favorece perfis mais positivos em caso de empate)
        const order = ['F','E','C','B','D','A'];
        let best = order[0], bestN = counts[order[0]];
        for (const l of order) {
          if (counts[l] > bestN) { best = l; bestN = counts[l]; }
        }
        return best;
      };

      const submitForm = async (e) => {
        e.preventDefault();
        if (!canSendForm) return;
        setStep('submitting');
        setError('');

        const letra = calcPerfil();
        const p = PERFIS[letra];

        const payload = {
          ...form,
          origem: p.origem, // origem = perfil vencedor
          perfil: letra, // letra A-F
          perfil_nome: p.nome,
          quiz_respostas: answers,
        };

        let ok = false;
        try {
          const res = await fetch('/.netlify/functions/submit', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(payload),
          });
          ok = res.ok;
        } catch {}

        if (ok) {
          try { localStorage.setItem('bs-lead', JSON.stringify(form)); } catch {}
          if (typeof window.fbq === 'function') {
            window.fbq('track', 'Lead', {
              content_name: 'Quiz · ' + p.nome,
              content_category: 'Quiz Arquétipos',
            });
          }
          setPerfil(letra);
          setStep('result');
        } else {
          setError('Não conseguimos registrar agora. Tente novamente em instantes, por favor.');
          setStep('form');
        }
      };

      // ===== RENDER =====
      const renderTopbar = () => (
        <header className="qz-topbar">
          <a href="/" className="qz-back">
            <svg width="14" height="10" viewBox="0 0 18 12" fill="none">
              <path d="M17 6H2M7 1L2 6l5 5" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
            </svg>
            <span>Voltar</span>
          </a>
          <div className="qz-topbar-brand">
            <span className="qz-topbar-brand-l1">Bastidores da Sindicatura</span>
            <span className="qz-topbar-brand-l2">Quiz · Que tipo de síndico você é?</span>
          </div>
        </header>
      );

      const renderProgress = () => {
        if (step === 'welcome' || step === 'result') return null;
        return (
          <div className="qz-progress">
            <div className="qz-progress-track">
              <div className="qz-progress-fill" style={{width: progressPct + '%'}}></div>
            </div>
            <div className="qz-progress-label">
              <span>
                {step === 'question' && <>Pergunta <em>{qIdx + 1}</em> de {totalQ}</>}
                {step === 'form' && <em>Quase lá</em>}
                {step === 'submitting' && <em>Revelando o seu perfil…</em>}
              </span>
              <span>{progressPct}%</span>
            </div>
          </div>
        );
      };

      const renderWelcome = () => (
        <div className="qz-welcome">
          <div className="qz-welcome-eyebrow">
            <span className="bs-rule"></span>
            <span className="bs-eyebrow">Quiz · Série Arquétipos</span>
          </div>
          <h1 className="qz-welcome-title">
            Que tipo de síndico <em>você é?</em>
          </h1>
          <p className="qz-welcome-lead">
            Dez perguntas pra descobrir o arquétipo que domina sua gestão. No fim, você recebe o e-book do seu perfil. Pronto pra leitura.
          </p>
          <div className="qz-welcome-meta">
            <div className="qz-welcome-meta-item">
              <span className="qz-welcome-meta-k">Perguntas</span>
              <span className="qz-welcome-meta-v">10</span>
            </div>
            <div className="qz-welcome-meta-item">
              <span className="qz-welcome-meta-k">Perfis</span>
              <span className="qz-welcome-meta-v">6</span>
            </div>
            <div className="qz-welcome-meta-item">
              <span className="qz-welcome-meta-k">Tempo</span>
              <span className="qz-welcome-meta-v">3 min</span>
            </div>
          </div>
          <button className="qz-cta" onClick={start}>
            <span>Começar o quiz</span>
            <svg width="18" height="12" viewBox="0 0 18 12" fill="none">
              <path d="M1 6h15M11 1l5 5-5 5" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
            </svg>
          </button>
        </div>
      );

      const renderQuestion = () => {
        const q = QUESTIONS[qIdx];
        const selected = answers[q.n];
        return (
          <div className="qz-question">
            <span className="qz-question-tag">Pergunta {q.n} de {totalQ}</span>
            <h2 className="qz-question-text">{q.text}</h2>
            <ul className="qz-options">
              {Object.entries(q.opts).map(([letra, txt]) => (
                <li key={letra}>
                  <button
                    className={'qz-option' + (selected === letra ? ' is-selected' : '')}
                    onClick={() => pickAnswer(letra)}
                  >
                    <span className="qz-option-letter">{letra}</span>
                    <span>{txt}</span>
                  </button>
                </li>
              ))}
            </ul>
            <div className="qz-question-nav">
              <button className="qz-nav-back" onClick={goBack} disabled={qIdx === 0}>
                ← Voltar
              </button>
              <span style={{fontSize: '11px', letterSpacing: '0.22em', textTransform: 'uppercase', color: 'rgba(247, 245, 242, 0.4)'}}>
                Clique numa opção pra avançar
              </span>
            </div>
          </div>
        );
      };

      const renderForm = () => (
        <div className="qz-form">
          <span className="qz-form-eyebrow">Quase lá</span>
          <h2 className="qz-form-title">
            Pra revelar o seu <em>perfil.</em>
          </h2>
          <p className="qz-form-sub">
            Preencha rapidamente. Ao enviar, você vê o resultado e recebe o e-book do seu arquétipo na próxima tela.
          </p>

          <form onSubmit={submitForm}>
            <div className="qz-field">
              <span className="qz-label">Nome completo</span>
              <input className="qz-input" type="text" required value={form.nome} onChange={(e) => setField('nome', e.target.value)} placeholder="Como devo te chamar?" />
            </div>
            <div className="qz-row">
              <div className="qz-field">
                <span className="qz-label">Cidade</span>
                <input className="qz-input" type="text" required value={form.cidade} onChange={(e) => setField('cidade', e.target.value)} placeholder="Sua cidade" />
              </div>
              <div className="qz-field">
                <span className="qz-label">Estado</span>
                <select className="qz-select" required value={form.estado} onChange={(e) => setField('estado', e.target.value)}>
                  <option value="" disabled>UF</option>
                  {UFS.map((uf) => <option key={uf} value={uf}>{uf}</option>)}
                </select>
              </div>
            </div>
            <div className="qz-field">
              <span className="qz-label">WhatsApp</span>
              <input className="qz-input" type="tel" required value={form.whatsapp} onChange={(e) => setField('whatsapp', e.target.value)} placeholder="(11) 99999-9999" />
            </div>
            <div className="qz-field">
              <span className="qz-label">E-mail</span>
              <input className="qz-input" type="email" required value={form.email} onChange={(e) => setField('email', e.target.value)} placeholder="seu@email.com" />
            </div>
            <div className="qz-field">
              <span className="qz-label">@ nas redes sociais</span>
              <input className="qz-input" type="text" required value={form.instagram} onChange={(e) => setField('instagram', e.target.value)} placeholder="@seuuser" />
            </div>
            <div className="qz-field">
              <span className="qz-label">Atua hoje como</span>
              <select className="qz-select" required value={form.atuacao} onChange={(e) => setField('atuacao', e.target.value)}>
                <option value="" disabled>Selecione</option>
                <option>Síndico profissional</option>
                <option>Síndico morador</option>
                <option>Gestor condominial</option>
                <option>Administradora</option>
                <option>Conselheiro</option>
                <option>Outro</option>
              </select>
            </div>

            <div className="qz-field">
              <span className="qz-label">Data de nascimento</span>
              <input type="date" className="qz-input" required value={form.data_nascimento} onChange={(e) => setField('data_nascimento', e.target.value)} />
            </div>

            <div className="qz-form-actions">
              <button type="submit" className="qz-cta" disabled={!canSendForm}>
                <span>Ver meu perfil</span>
                <svg width="18" height="12" viewBox="0 0 18 12" fill="none">
                  <path d="M1 6h15M11 1l5 5-5 5" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
                </svg>
              </button>
            </div>

            {error && <p className="qz-form-error">{error}</p>}

            <p className="qz-form-micro">
              Seu perfil aparece na próxima tela junto com o e-book. Você também pode receber materiais e novidades da Bastidores da Sindicatura.
            </p>
            <p className="qz-form-micro" style={{marginTop: 6}}>
              Ao se inscrever você aceita a{' '}
              <a href="/politica-de-privacidade/" style={{color: 'var(--sand)', textDecoration: 'underline'}}>política de privacidade</a>.
            </p>
          </form>
        </div>
      );

      const renderSubmitting = () => (
        <div className="qz-loading">
          <p>Revelando o seu perfil<em>…</em></p>
        </div>
      );

      const renderResult = () => {
        const p = PERFIS[perfil];
        return (
          <div className="qz-result">
            <span className="qz-result-eyebrow">
              <span className="bs-rule"></span>
              <span>Seu arquétipo · {p.eyebrow}</span>
            </span>
            <p className="qz-result-arquetipo">Você é</p>
            <h1 className="qz-result-title">
              <em>{p.titulo}</em>
            </h1>
            <p className="qz-result-lead">
              <strong>{p.subtitulo}</strong> {p.lead}
            </p>

            <div className="qz-result-cards">
              <div className="qz-result-card">
                <span className="qz-result-card-k">Seu maior risco</span>
                <p className="qz-result-card-v">{p.risco}</p>
              </div>
              <div className="qz-result-card">
                <span className="qz-result-card-k">Próximo passo</span>
                <p className="qz-result-card-v">{p.proximo}</p>
              </div>
            </div>

            <div className="qz-result-cta-block">
              <span className="qz-result-cta-k">O e-book do seu perfil</span>
              <h3 className="qz-result-cta-h">{p.titulo}</h3>
              <p className="qz-result-cta-sub">
                Guia editorial com diagnóstico, ferramentas e plano de ação pra virar a chave do seu arquétipo.
              </p>
              <a href={p.pdfUrl} target="_blank" rel="noreferrer" className="qz-result-cta-btn">
                <span>Baixar o guia em PDF</span>
                <svg width="18" height="12" viewBox="0 0 18 12" fill="none">
                  <path d="M1 6h15M11 1l5 5-5 5" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
                </svg>
              </a>
            </div>

            <div className="qz-result-mentoria">
              <span className="qz-result-mentoria-eyebrow">Capítulo seguinte</span>
              <p className="qz-result-mentoria-text">
                Se quiser ir além do guia, conheça a <strong>Mentoria Bastidores da Sindicatura.</strong> Vagas limitadas, seleção feita pessoalmente.
              </p>
              <a href="/#vagas" className="qz-cta-ghost">
                Conhecer a mentoria
              </a>
            </div>
          </div>
        );
      };

      return (
        <div className="qz-stage">
          <div className="qz-root">
            {renderTopbar()}
            {renderProgress()}
            <main className="qz-main">
              {step === 'welcome' && renderWelcome()}
              {step === 'question' && renderQuestion()}
              {step === 'form' && renderForm()}
              {step === 'submitting' && renderSubmitting()}
              {step === 'result' && renderResult()}
            </main>
          </div>
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<QuizApp />);
  </script>
</body>
</html>
