<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pagamento cancelado · Bastidores da Sindicatura</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="../../tokens.css" />
  <style>
    html, body { margin: 0; padding: 0; background: var(--onix); color: var(--offwhite); min-height: 100vh; font-family: Georgia, 'Bodoni Moda', serif; }
    body { display: flex; align-items: center; justify-content: center; padding: 32px 22px; }
    .card { max-width: 540px; width: 100%; background: rgba(247,245,242,0.04); border: 1px solid rgba(217,119,87,0.4); padding: 44px 36px; text-align: center; }
    .badge { display: inline-block; padding: 6px 14px; background: rgba(217,119,87,0.15); color: #d97757; font-size: 11px; letter-spacing: 0.24em; text-transform: uppercase; font-weight: 700; margin-bottom: 18px; }
    h1 { font-family: 'Bodoni Moda', Georgia, serif; font-weight: 400; font-size: 34px; line-height: 1.1; margin: 0 0 16px; }
    p { font-size: 15px; line-height: 1.6; color: rgba(247,245,242,0.78); margin: 0 0 14px; }
    .actions { display: flex; gap: 10px; justify-content: center; margin-top: 22px; flex-wrap: wrap; }
    .cta { display: inline-block; padding: 14px 24px; text-decoration: none; font-size: 12px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; border: 1px solid var(--sand); color: var(--sand); }
    .cta.is-primary { background: var(--sand); color: var(--onix); }
    .cta:hover { opacity: 0.86; }
  </style>
  <script defer data-domain="bastidoresdasindicatura.com.br" src="https://plausible.io/js/script.js"></script>
</head>
<body>
  <div class="card">
    <span class="badge">Pagamento não concluído</span>
    <h1>Sua vaga ainda está aberta.</h1>
    <p>Você cancelou ou fechou a página antes do pagamento. Se foi um engano, é só voltar e tentar de novo — nenhum valor foi cobrado.</p>
    <div class="actions">
      <a class="cta is-primary" href="/comprar-experience/">Tentar Experience</a>
      <a class="cta" href="/comprar-executive/">Tentar Executive</a>
      <a class="cta" href="/">Voltar pro site</a>
    </div>
  </div>
  <script src="/bs-members-link.js" defer></script>
</body>
</html>
