              <div className="ck-form-wrap">
                <div className="ck-form-head">
                  <span className="ck-form-tag">Receba o manual</span>
                  <h2 className="ck-form-title">Acesso imediato.</h2>
                  <p className="ck-form-sub">
                    Preencha rapidamente. O manual em PDF aparece na próxima tela,
                    pronto para leitura.
                  </p>
                </div>

                <form onSubmit={submit}>
                  <label className="ck-field">
                    <span className="ck-label">Nome completo</span>
                    <input type="text" required value={data.nome} onChange={(e) => setField('nome', e.target.value)} placeholder="Como devo te chamar?" />
                  </label>
                  <div className="ck-row">
                    <label className="ck-field">
                      <span className="ck-label">Cidade</span>
                      <input type="text" required value={data.cidade} onChange={(e) => setField('cidade', e.target.value)} placeholder="Sua cidade" />
                    </label>
                    <label className="ck-field">
                      <span className="ck-label">Estado</span>
                      <select required value={data.estado} onChange={(e) => setField('estado', e.target.value)}>
                        <option value="" disabled>UF</option>
                        {UFS.map((uf) => <option key={uf} value={uf}>{uf}</option>)}
                      </select>
                    </label>
                  </div>
                  <label className="ck-field">
                    <span className="ck-label">WhatsApp</span>
                    <input type="tel" required value={data.whatsapp} onChange={(e) => setField('whatsapp', e.target.value)} placeholder="(11) 99999-9999" />
                  </label>
                  <label className="ck-field">
                    <span className="ck-label">E-mail</span>
                    <input type="email" required value={data.email} onChange={(e) => setField('email', e.target.value)} placeholder="seu@email.com" />
                  </label>
                  <label className="ck-field">
                    <span className="ck-label">@ nas redes sociais</span>
                    <input type="text" required value={data.instagram} onChange={(e) => setField('instagram', e.target.value)} placeholder="@seuuser" />
                  </label>
                  <label className="ck-field">
                    <span className="ck-label">Atua hoje como</span>
                    <select required value={data.atuacao} onChange={(e) => setField('atuacao', e.target.value)}>
                      <option value="" disabled>Selecione</option>
                      <option>Síndico profissional</option>
                      <option>Síndico morador</option>
                      <option>Gestor condominial</option>
                      <option>Administradora</option>
                      <option>Conselheiro</option>
                      <option>Outro</option>
                    </select>
                  </label>
                  <label className="ck-field">
                    <span className="ck-label">Data de nascimento</span>
                    <input type="date" required value={data.data_nascimento} onChange={(e) => setField('data_nascimento', e.target.value)} />
                  </label>

                  <button type="submit" className="ck-cta" disabled={!canSend}>
                    <span>{submitting ? 'Abrindo o manual…' : 'Quero o Manual'}</span>
                    {!submitting && (
                      <svg width="18" height="12" viewBox="0 0 18 12" fill="none">
                        <path d="M1 6h15M11 1l5 5-5 5" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
                      </svg>
                    )}
                  </button>

                  {error && <p className="ck-error">{error}</p>}

                  <p className="ck-micro">
                    Manual entregue na próxima tela. Você também receberá no e-mail informado.
                  </p>
                  <p className="ck-micro" style={{marginTop: 6}}>
                    Ao se inscrever você aceita a{' '}
                    <a href="/politica-de-privacidade/" style={{color: 'var(--sand)', textDecoration: 'underline'}}>política de privacidade</a>.
                  </p>
                </form>
              </div>
            </section>

            {/* Footer block */}
            <div className="ck-footer-block">
              <p className="ck-footer-text">
                "O síndico que domina a comunicação <em>protege a própria
                autoridade.</em> Quem não domina é engolido por ela. No grupo,
                não se trata de vencer a discussão — e sim de preservar a gestão."
              </p>
              <div className="ck-footer-brand">
                <span className="ck-footer-brand-l1">Juliana Moreira</span>
                <span className="ck-footer-brand-l2">CEO Sindicompany · Condo Academy</span>
              </div>
              <p style={{margin: '20px 0 0', fontSize: '11px', letterSpacing: '0.16em', textTransform: 'uppercase', color: 'rgba(247,245,242,0.45)'}}>
                <a href="/politica-de-privacidade/" style={{color: 'inherit', textDecoration: 'underline'}}>Política de Privacidade</a>
              </p>
            </div>
          </div>
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<WhatsappLanding />);
  </script>

  <!-- Form HTML estático para Netlify Forms detectar -->
  <form name="sobrevivencia-whatsapp-aplicacao" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="text" name="bot-field" />
    <input type="text" name="nome" />
    <input type="text" name="cidade" />
    <input type="text" name="estado" />
    <input type="tel" name="whatsapp" />
    <input type="email" name="email" />
    <input type="text" name="instagram" />
    <input type="text" name="atuacao" />
    <input type="text" name="origem" />
  </form>
  <script src="/bs-members-link.js" defer></script>
</body>
</html>
