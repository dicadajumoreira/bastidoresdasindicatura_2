<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Área de Membros · Bastidores da Sindicatura</title>
  <meta name="description" content="Acesso aos materiais publicados do Bastidores da Sindicatura. Login pelo e-mail cadastrado." />
  <meta name="robots" content="noindex, nofollow" />

  <link rel="canonical" href="https://bastidoresdasindicatura.com.br/membros/" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="../tokens.css" />
  <link rel="stylesheet" href="../bastidores.css" />

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>

  <style>
    html, body { margin: 0; padding: 0; background: var(--onix); min-height: 100vh; color: var(--offwhite); }
    body { font-family: var(--font-sans, Georgia, serif); -webkit-font-smoothing: antialiased; }

    .mb-login-stage {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
    }
    .mb-login-card {
      background: rgba(247, 245, 242, 0.04);
      border: 1px solid rgba(247, 245, 242, 0.14);
      padding: 48px 40px;
      max-width: 440px;
      width: 100%;
    }
    .mb-login-eyebrow {
      display: block;
      font-size: 11px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--sand, #DABDA9);
      font-weight: 700;
      margin-bottom: 14px;
    }
    .mb-login-title {
      font-family: 'Bodoni Moda', Georgia, serif;
      font-style: italic;
      font-weight: 400;
      font-size: 40px;
      line-height: 1.05;
      margin: 0 0 16px;
      color: var(--offwhite);
    }
    .mb-login-title em { font-style: normal; color: var(--sand, #DABDA9); }
    .mb-login-lead {
      font-size: 14px;
      line-height: 1.6;
      color: rgba(247, 245, 242, 0.7);
      margin: 0 0 28px;
    }
    .mb-field { display: block; margin-bottom: 20px; }
    .mb-label {
      display: block;
      font-size: 10px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(247, 245, 242, 0.55);
      margin-bottom: 8px;
      font-weight: 600;
    }
    .mb-input {
      width: 100%;
      box-sizing: border-box;
      background: transparent;
      border: none;
      border-bottom: 1px solid rgba(247, 245, 242, 0.25);
      padding: 12px 0;
      color: var(--offwhite);
      font-size: 16px;
      font-family: inherit;
    }
    .mb-input:focus { outline: none; border-bottom-color: var(--sand, #DABDA9); }
    .mb-input::placeholder { color: rgba(247, 245, 242, 0.3); font-style: italic; }

    .mb-cta {
      width: 100%;
      background: var(--sand, #DABDA9);
      color: var(--onix, #1A1C29);
      border: none;
      padding: 16px 24px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      cursor: pointer;
      font-family: inherit;
      transition: opacity 140ms;
    }
    .mb-cta:hover { opacity: 0.85; }
    .mb-cta:disabled { opacity: 0.4; cursor: not-allowed; }

    .mb-link-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 18px;
      gap: 14px;
      flex-wrap: wrap;
    }
    .mb-link {
      background: none;
      border: none;
      color: var(--sand, #DABDA9);
      cursor: pointer;
      font-family: inherit;
      font-size: 12px;
      letter-spacing: 0.06em;
      padding: 0;
      text-decoration: underline;
    }
    .mb-link:hover { color: var(--offwhite); }

    .mb-msg-ok {
      background: rgba(129, 148, 112, 0.12);
      border-left: 3px solid #819470;
      padding: 16px 20px;
      margin: 20px 0 0;
      font-size: 14px;
      line-height: 1.6;
    }
    .mb-msg-err {
      background: rgba(217, 119, 87, 0.12);
      border-left: 3px solid #d97757;
      padding: 16px 20px;
      margin: 20px 0 0;
      font-size: 14px;
      line-height: 1.6;
    }

    .mb-login-back {
      display: inline-block;
      margin-top: 24px;
      font-size: 12px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(247, 245, 242, 0.45);
      text-decoration: none;
      font-weight: 600;
    }
    .mb-login-back:hover { color: var(--sand, #DABDA9); }

    /* === ÁREA LOGADA === */
    .mb-shell { min-height: 100vh; }
    .mb-topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 22px 40px; border-bottom: 1px solid rgba(247, 245, 242, 0.08);
    }
    .mb-brand { display: flex; flex-direction: column; }
    .mb-brand-l1 {
      font-family: 'Bodoni Moda', Georgia, serif;
      font-style: italic; font-size: 18px; color: var(--offwhite);
    }
    .mb-brand-l2 {
      font-size: 9px; letter-spacing: 0.28em; text-transform: uppercase;
      color: var(--sand, #DABDA9); font-weight: 700; margin-top: 2px;
    }
    .mb-user { display: flex; align-items: center; gap: 16px; }
    .mb-user-name { font-size: 13px; color: rgba(247, 245, 242, 0.75); }
    .mb-user-name strong { color: var(--offwhite); }
    .mb-logout {
      background: transparent; border: 1px solid rgba(247, 245, 242, 0.18);
      color: rgba(247, 245, 242, 0.7); padding: 8px 14px; font-size: 11px;
      letter-spacing: 0.16em; text-transform: uppercase; cursor: pointer;
      font-weight: 600; font-family: inherit;
    }
    .mb-logout:hover { color: var(--offwhite); border-color: var(--sand, #DABDA9); }

    .mb-hero { padding: 64px 40px 32px; max-width: 920px; margin: 0 auto; }
    .mb-hero-eyebrow {
      display: block; font-size: 11px; letter-spacing: 0.22em;
      text-transform: uppercase; color: var(--sand, #DABDA9);
      font-weight: 700; margin-bottom: 16px;
    }
    .mb-hero-title {
      font-family: 'Bodoni Moda', Georgia, serif; font-style: italic;
      font-weight: 400; font-size: clamp(40px, 6vw, 64px);
      line-height: 1.0; margin: 0 0 18px; color: var(--offwhite);
    }
    .mb-hero-title em { font-style: normal; color: var(--sand, #DABDA9); }
    .mb-hero-lead {
      font-size: 16px; line-height: 1.6;
      color: rgba(247, 245, 242, 0.7); margin: 0 0 12px; max-width: 580px;
    }

    .mb-filters {
      display: flex; gap: 8px; padding: 0 40px;
      max-width: 1080px; margin: 16px auto 24px; flex-wrap: wrap;
    }
    .mb-filter {
      background: transparent; border: 1px solid rgba(247, 245, 242, 0.14);
      color: rgba(247, 245, 242, 0.65); padding: 8px 14px;
      font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase;
      cursor: pointer; font-family: inherit; font-weight: 600;
      transition: all 120ms;
    }
    .mb-filter:hover { color: var(--offwhite); border-color: var(--sand, #DABDA9); }
    .mb-filter.is-on { background: var(--sand, #DABDA9); color: var(--onix); border-color: var(--sand, #DABDA9); }

    .mb-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 22px; padding: 0 40px 96px;
      max-width: 1080px; margin: 0 auto;
    }
    .mb-card {
      background: rgba(247, 245, 242, 0.03);
      border: 1px solid rgba(247, 245, 242, 0.12);
      padding: 28px 26px 24px;
      display: flex; flex-direction: column;
      transition: all 180ms;
      position: relative; overflow: hidden;
    }
    .mb-card::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0;
      height: 3px; background: var(--sand, #DABDA9);
      transform: scaleX(0); transform-origin: left;
      transition: transform 260ms;
    }
    .mb-card:hover { background: rgba(247, 245, 242, 0.06); border-color: rgba(218, 189, 169, 0.4); }
    .mb-card:hover::before { transform: scaleX(1); }

    .mb-card-eyebrow {
      display: block; font-size: 10px; letter-spacing: 0.22em;
      text-transform: uppercase; color: var(--sand, #DABDA9);
      font-weight: 700; margin-bottom: 8px;
    }
    .mb-card-volume {
      font-family: 'SF Mono', Menlo, Consolas, monospace;
      font-size: 11px; color: rgba(247, 245, 242, 0.4);
      letter-spacing: 0.04em; margin-bottom: 4px;
    }
    .mb-card-title {
      font-family: 'Bodoni Moda', Georgia, serif; font-style: italic;
      font-weight: 400; font-size: 22px; line-height: 1.1;
      color: var(--offwhite); margin: 0 0 12px;
    }
    .mb-card-desc {
      font-size: 13px; line-height: 1.55;
      color: rgba(247, 245, 242, 0.65); margin: 0 0 24px; flex: 1;
    }
    .mb-card-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .mb-card-btn {
      display: inline-flex; align-items: center; gap: 8px;
      background: var(--onix, #1A1C29); color: var(--offwhite);
      border: 1px solid var(--offwhite); padding: 10px 16px;
      font-size: 11px; font-weight: 700; letter-spacing: 0.18em;
      text-transform: uppercase; text-decoration: none; cursor: pointer;
      font-family: inherit; transition: all 140ms;
    }
    .mb-card-btn:hover { background: var(--offwhite); color: var(--onix); }
    .mb-card-btn.is-secondary { background: transparent; }
    .mb-empty {
      text-align: center; padding: 48px 24px;
      color: rgba(247, 245, 242, 0.5); font-style: italic;
      grid-column: 1 / -1;
    }

    @media (max-width: 720px) {
      .mb-topbar { padding: 16px 20px; flex-wrap: wrap; gap: 12px; }
      .mb-hero { padding: 40px 20px 24px; }
      .mb-filters { padding: 0 20px; }
      .mb-grid { padding: 0 20px 64px; gap: 14px; }
      .mb-login-card { padding: 36px 26px; }
      .mb-login-title { font-size: 32px; }
      .mb-user-name { display: none; }
      .mb-mentoria-banner { padding: 28px 22px; margin: 24px 20px 0; }
      .mb-mentoria-title { font-size: 26px; }
      .mb-profile-card { padding: 32px 22px; margin: 0 20px 64px; }
      .mb-profile-row { grid-template-columns: 1fr; }
      .mb-nav { gap: 14px; }
    }

    /* === NAV DA ÁREA LOGADA === */
    .mb-nav {
      display: flex;
      align-items: center;
      gap: 22px;
    }
    .mb-nav-link {
      background: none;
      border: none;
      color: rgba(247, 245, 242, 0.6);
      cursor: pointer;
      font-family: inherit;
      font-size: 11px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      font-weight: 600;
      padding: 6px 0;
      border-bottom: 1px solid transparent;
      transition: all 140ms;
    }
    .mb-nav-link:hover { color: var(--offwhite, #F7F5F2); }
    .mb-nav-link.is-on {
      color: var(--sand, #DABDA9);
      border-bottom-color: var(--sand, #DABDA9);
    }

    /* === BANNER MENTORIA === */
    .mb-mentoria-banner {
      max-width: 1080px;
      margin: 32px auto 8px;
      padding: 38px 44px;
      background: linear-gradient(135deg, rgba(218, 189, 169, 0.16) 0%, rgba(184, 149, 121, 0.10) 100%);
      border: 1px solid rgba(218, 189, 169, 0.40);
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 32px;
      flex-wrap: wrap;
    }
    .mb-mentoria-banner::before {
      content: '';
      position: absolute;
      top: -40px; right: -40px;
      width: 180px; height: 180px;
      background: radial-gradient(circle, rgba(218, 189, 169, 0.18) 0%, transparent 70%);
      pointer-events: none;
    }
    .mb-mentoria-text { flex: 1; min-width: 280px; position: relative; }
    .mb-mentoria-eyebrow {
      display: block;
      font-size: 10px;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: var(--sand, #DABDA9);
      font-weight: 700;
      margin-bottom: 12px;
    }
    .mb-mentoria-title {
      font-family: 'Bodoni Moda', Georgia, serif;
      font-style: italic;
      font-weight: 400;
      font-size: clamp(28px, 4vw, 38px);
      line-height: 1.05;
      margin: 0 0 12px;
      color: var(--offwhite);
    }
    .mb-mentoria-title em { font-style: normal; color: var(--sand, #DABDA9); }
    .mb-mentoria-lead {
      margin: 0 0 0;
      font-size: 14px;
      line-height: 1.55;
      color: rgba(247, 245, 242, 0.78);
      max-width: 520px;
    }
    .mb-mentoria-cta {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: var(--sand, #DABDA9);
      color: var(--onix, #1A1C29);
      border: 1px solid var(--sand);
      padding: 16px 26px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      text-decoration: none;
      font-family: inherit;
      transition: all 140ms;
      white-space: nowrap;
      position: relative;
    }
    .mb-mentoria-cta:hover { background: var(--offwhite, #F7F5F2); }

    /* === PROFILE VIEW === */
    .mb-profile-wrap {
      max-width: 720px;
      margin: 0 auto;
      padding: 0 40px 96px;
    }
    .mb-profile-card {
      background: rgba(247, 245, 242, 0.03);
      border: 1px solid rgba(247, 245, 242, 0.12);
      padding: 40px 44px;
    }
    .mb-profile-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }
    .mb-profile-row .mb-field { margin-bottom: 0; }
    .mb-profile-section { margin-bottom: 22px; }
    .mb-profile-meta {
      margin: 12px 0 28px;
      font-size: 12px;
      color: rgba(247, 245, 242, 0.45);
      letter-spacing: 0.06em;
    }
    .mb-profile-meta strong { color: rgba(247, 245, 242, 0.7); font-weight: 600; }
    .mb-select {
      width: 100%;
      box-sizing: border-box;
      background: transparent;
      border: none;
      border-bottom: 1px solid rgba(247, 245, 242, 0.25);
      padding: 12px 0;
      color: var(--offwhite);
      font-size: 16px;
      font-family: inherit;
      cursor: pointer;
    }
    .mb-select:focus { outline: none; border-bottom-color: var(--sand, #DABDA9); }
    .mb-select option { background: var(--onix); color: var(--offwhite); }

    /* === SEÇÃO MENTORIA NA ÁREA DE MEMBROS === */
    .mb-mentoria-area {
      max-width: 1080px;
      margin: 32px auto 0;
      padding: 0 40px;
    }
    .mb-mentoria-area-eyebrow {
      display: block;
      font-size: 11px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--sand, #DABDA9);
      font-weight: 700;
      margin-bottom: 12px;
    }
    .mb-mentoria-area-title {
      font-family: 'Bodoni Moda', Georgia, serif;
      font-style: italic;
      font-weight: 400;
      font-size: clamp(26px, 4vw, 36px);
      line-height: 1.05;
      margin: 0 0 22px;
      color: var(--offwhite);
    }
    .mb-mentoria-area-title em { font-style: normal; color: var(--sand); }

    .mb-mentoria-card {
      padding: 36px 40px;
      background: rgba(247, 245, 242, 0.04);
      border: 1px solid rgba(247, 245, 242, 0.12);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 28px;
      flex-wrap: wrap;
      position: relative;
      overflow: hidden;
    }
    .mb-mentoria-card.is-locked {
      background: linear-gradient(135deg, rgba(247,245,242,0.04) 0%, rgba(247,245,242,0.02) 100%);
      border-style: dashed;
      border-color: rgba(247, 245, 242, 0.18);
    }
    .mb-mentoria-card.is-active {
      background: linear-gradient(135deg, rgba(129,148,112,0.16) 0%, rgba(129,148,112,0.06) 100%);
      border-color: rgba(129, 148, 112, 0.5);
    }
    .mb-mentoria-card-info { flex: 1; min-width: 280px; display: flex; align-items: center; gap: 22px; }
    .mb-mentoria-icon {
      width: 64px; height: 64px; flex-shrink: 0;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 28px;
      background: rgba(247, 245, 242, 0.06);
      border: 1px solid rgba(247, 245, 242, 0.18);
    }
    .mb-mentoria-card.is-active .mb-mentoria-icon {
      background: rgba(129, 148, 112, 0.22);
      border-color: rgba(129, 148, 112, 0.5);
      color: #B9D199;
    }
    .mb-mentoria-card-text { flex: 1; }
    .mb-mentoria-card-eyebrow {
      display: block; font-size: 10px;
      letter-spacing: 0.28em; text-transform: uppercase;
      font-weight: 700; margin-bottom: 6px;
    }
    .mb-mentoria-card.is-locked .mb-mentoria-card-eyebrow { color: rgba(247,245,242,0.45); }
    .mb-mentoria-card.is-active .mb-mentoria-card-eyebrow { color: #819470; }
    .mb-mentoria-card-name {
      font-family: 'Bodoni Moda', Georgia, serif;
      font-style: italic; font-weight: 400;
      font-size: 22px; color: var(--offwhite);
      margin: 0 0 6px;
    }
    .mb-mentoria-card-desc {
      font-size: 13px; line-height: 1.5;
      color: rgba(247, 245, 242, 0.65); margin: 0;
    }
    .mb-mentoria-card-cta {
      display: inline-flex; align-items: center; gap: 10px;
      padding: 14px 22px;
      font-size: 11px; font-weight: 700;
      letter-spacing: 0.18em; text-transform: uppercase;
      text-decoration: none; font-family: inherit;
      transition: all 140ms; white-space: nowrap;
      border: 1px solid;
      cursor: pointer;
    }
    .mb-mentoria-card.is-active .mb-mentoria-card-cta {
      background: #819470; color: var(--offwhite);
      border-color: #819470;
    }
    .mb-mentoria-card.is-active .mb-mentoria-card-cta:hover {
      background: var(--offwhite); color: var(--onix);
    }
    .mb-mentoria-card.is-locked .mb-mentoria-card-cta {
      background: transparent; color: rgba(247,245,242,0.45);
      border-color: rgba(247,245,242,0.25);
      cursor: not-allowed;
      pointer-events: none;
    }
    @media (max-width: 720px) {
      .mb-mentoria-area { padding: 0 20px; }
      .mb-mentoria-card { padding: 26px 22px; }
      .mb-mentoria-card-info { flex-direction: column; align-items: flex-start; gap: 14px; }
      .mb-mentoria-icon { width: 48px; height: 48px; font-size: 22px; }
      .mb-mentoria-card-cta { width: 100%; justify-content: center; }
    }

    /* === CRONOGRAMA DAS AULAS === */
    .mb-aulas-grid {
      margin-top: 28px;
    }
    .mb-aulas-head { margin-bottom: 16px; }
    .mb-aulas-eyebrow {
      display: block;
      font-size: 10px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--sand);
      font-weight: 700;
      margin-bottom: 8px;
    }
    .mb-aulas-title {
      font-family: 'Bodoni Moda', Georgia, serif;
      font-style: italic;
      font-weight: 400;
      font-size: 24px;
      margin: 0;
      color: var(--offwhite);
    }
    .mb-aulas-title em { font-style: normal; color: var(--sand); }
    .mb-aulas-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .mb-aula {
      display: grid;
      grid-template-columns: 180px 1fr 200px;
      gap: 18px;
      align-items: center;
      padding: 16px 22px;
      background: rgba(247, 245, 242, 0.025);
      border: 1px solid rgba(247, 245, 242, 0.08);
      border-left: 3px solid rgba(247, 245, 242, 0.15);
      transition: all 140ms;
    }
    .mb-aula.is-today {
      background: rgba(129, 148, 112, 0.10);
      border-color: rgba(129, 148, 112, 0.5);
      border-left-color: #819470;
      border-left-width: 3px;
    }
    .mb-aula.has-recording {
      border-left-color: var(--sand);
    }
    .mb-aula-date {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .mb-aula-num {
      font-family: 'SF Mono', Menlo, Consolas, monospace;
      font-size: 11px;
      letter-spacing: 0.14em;
      color: rgba(247, 245, 242, 0.5);
      font-weight: 600;
    }
    .mb-aula-day {
      font-family: 'SF Mono', Menlo, Consolas, monospace;
      font-size: 14px;
      color: var(--offwhite);
      letter-spacing: 0.06em;
    }
    .mb-aula-horario {
      font-family: 'SF Mono', Menlo, Consolas, monospace;
      font-size: 10px;
      color: rgba(247, 245, 242, 0.45);
      letter-spacing: 0.06em;
    }
    .mb-aula.is-today .mb-aula-day { color: #B9D199; font-weight: 700; }
    .mb-aula.is-particular {
      background: rgba(184, 149, 121, 0.06);
      border-color: rgba(184, 149, 121, 0.25);
      border-left-color: #B89579;
    }
    .mb-aula.is-particular .mb-aula-num { color: #B89579; }
    .mb-aula-content { min-width: 0; }
    .mb-aula-title {
      margin: 0 0 4px;
      font-family: 'Bodoni Moda', Georgia, serif;
      font-style: italic;
      font-size: 17px;
      color: var(--offwhite);
    }
    .mb-aula-desc {
      margin: 0;
      font-size: 12px;
      line-height: 1.45;
      color: rgba(247, 245, 242, 0.55);
    }
    .mb-aula-action { text-align: right; }
    .mb-aula-cta {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 10px 16px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      text-decoration: none;
      border: 1px solid;
      transition: all 140ms;
    }
    .mb-aula-cta.is-live {
      background: #819470;
      color: var(--offwhite);
      border-color: #819470;
    }
    .mb-aula-cta.is-live:hover { background: var(--offwhite); color: var(--onix); }
    .mb-aula-cta.is-recording {
      background: transparent;
      color: var(--sand);
      border-color: var(--sand);
    }
    .mb-aula-cta.is-recording:hover { background: var(--sand); color: var(--onix); }
    .mb-aula-status {
      font-size: 10px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      font-weight: 600;
    }
    .mb-aula-status.is-future { color: rgba(247, 245, 242, 0.4); }
    .mb-aula-status.is-pending { color: #d97757; }
    .mb-aula-status.is-locked {
      color: rgba(247, 245, 242, 0.35);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    /* Estado bloqueado: aula visível como teaser pra quem não comprou.
       Datas visíveis (info pública), conteúdo abafado, CTA "reservar". */
    .mb-aula.is-locked {
      opacity: 0.55;
      background: rgba(247, 245, 242, 0.015);
      border-color: rgba(247, 245, 242, 0.07);
    }
    .mb-aula.is-locked .mb-aula-num { color: rgba(247, 245, 242, 0.4); }
    .mb-aula.is-locked .mb-aula-day { color: rgba(247, 245, 242, 0.6); }
    .mb-aula.is-locked .mb-aula-title { color: rgba(247, 245, 242, 0.55); }
    .mb-aula.is-locked .mb-aula-desc { color: rgba(247, 245, 242, 0.35); }
    .mb-aulas-cta-locked {
      margin-top: 18px;
      padding: 18px 22px;
      background: rgba(218, 189, 169, 0.08);
      border: 1px dashed rgba(218, 189, 169, 0.35);
      text-align: center;
    }
    .mb-aulas-cta-locked-text {
      font-size: 13px;
      color: rgba(247, 245, 242, 0.75);
      margin: 0 0 12px;
      line-height: 1.5;
    }
    .mb-aulas-cta-locked-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--sand);
      color: var(--onix);
      padding: 14px 22px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      text-decoration: none;
      border: 1px solid var(--sand);
      transition: opacity 0.18s ease;
    }
    .mb-aulas-cta-locked-btn:hover { opacity: 0.86; }
    @media (max-width: 720px) {
      .mb-aula {
        grid-template-columns: 1fr;
        gap: 10px;
        padding: 14px 18px;
      }
      .mb-aula-action { text-align: left; }
      .mb-aula-cta { width: 100%; justify-content: center; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const STORAGE_KEY = 'bs-membros-token';

    const MATERIAIS = [
      {volume:'V09', eyebrow:'Volume 09 · Guia editorial', titulo:'Saúde Mental do Síndico', desc:'O custo emocional invisível da profissão. 10 capítulos, autoavaliação com +50 itens e plano de 30 dias.', pdf:'/saude-mental/material.pdf', landing:'/saude-mental/', tags:['guia']},
      {volume:'V08', eyebrow:'Volume 08 · Guia editorial', titulo:'Conflitos absurdos em condomínio', desc:'Os casos mais absurdos de conflito real em condomínio, com método pra desarmar antes de virarem crise.', pdf:'/conflitos/material.pdf', landing:'/conflitos/', tags:['guia']},
      {volume:'V07', eyebrow:'Volume 07 · Guia editorial', titulo:'Gestão sob Ataque', desc:'20 capítulos pra atravessar boatos, grupos inflamados e tentativas de destituição.', pdf:'/gestao-sob-ataque/material.pdf', landing:'/gestao-sob-ataque/', tags:['guia']},
      {volume:'V06', eyebrow:'Volume 06 · Guia editorial', titulo:'NR-1 nos Condomínios', desc:'Tudo sobre a NR-1 aplicada à realidade condominial. O que muda e como se adequar.', pdf:'/nr1/material.pdf', landing:'/nr1/', tags:['guia']},
      {volume:'V05', eyebrow:'Volume 05 · Guia editorial', titulo:'50 Frases pra responder sem perder a cabeça', desc:'50 respostas prontas para os comentários, cobranças e provocações mais comuns.', pdf:'/50-frases/material.pdf', landing:'/50-frases/', tags:['guia']},
      {volume:'V04', eyebrow:'Volume 04 · Manual', titulo:'Sobrevivência ao WhatsApp do Condomínio', desc:'O guia prático pra parar de ser refém do grupo. Comunicação, protocolo e quando responder.', pdf:'/sobrevivencia-whatsapp/material.pdf', landing:'/sobrevivencia-whatsapp/', tags:['manual']},
      {volume:'V03', eyebrow:'Volume 03 · E-book', titulo:'Síndico Profissional', desc:'O caminho pra construir uma carreira sólida como síndico profissional.', pdf:'/sindico-profissional/material.pdf', landing:'/sindico-profissional/', tags:['ebook']},
      {volume:'V02', eyebrow:'Volume 02 · E-book', titulo:'Inteligência Artificial em Condomínios', desc:'Casos de uso, ferramentas e protocolos pra integrar IA na gestão condominial.', pdf:'/ebook-ia/material.pdf', landing:'/ebook-ia/', tags:['ebook']},
      {volume:'V01', eyebrow:'Volume 01 · Checklist', titulo:'Como organizar uma assembleia', desc:'Checklist completo: do edital ao registro. Cabe no bolso, evita refazer.', pdf:'/checklist/material.pdf', landing:'/checklist/', tags:['checklist']},
      {volume:'V12', eyebrow:'Série Arquétipos · 12', titulo:'O Bombeiro', desc:'Diagnóstico pra síndicos que vivem correndo atrás de problema. Matriz de prioridades, método 30-30-30.', pdf:'/bombeiro/material.pdf', landing:'/bombeiro/', tags:['arquetipos'], arquetipoKey:'bombeiro'},
      {volume:'V13', eyebrow:'Série Arquétipos · 13', titulo:'O Político', desc:'Pra síndicos bem-intencionados que estão perdendo autoridade na busca por consenso.', pdf:'/politico/material.pdf', landing:'/politico/', tags:['arquetipos'], arquetipoKey:'politico'},
      {volume:'V14', eyebrow:'Série Arquétipos · 14', titulo:'O Solitário', desc:'Pra síndicos dedicados que viraram o gargalo da gestão. Delegação, processo e fim do modo herói.', pdf:'/solitario/material.pdf', landing:'/solitario/', tags:['arquetipos'], arquetipoKey:'solitario'},
      {volume:'V15', eyebrow:'Série Arquétipos · 15', titulo:'O Burocrata', desc:'Pra síndicos organizados que escrevem comunicado impecável e ninguém lê.', pdf:'/burocrata/material.pdf', landing:'/burocrata/', tags:['arquetipos'], arquetipoKey:'burocrata'},
      {volume:'V16', eyebrow:'Série Arquétipos · 16', titulo:'O Estrategista', desc:'Pra quem já opera em modo estratégico e quer sustentar esse jeito de trabalhar.', pdf:'/estrategista/material.pdf', landing:'/estrategista/', tags:['arquetipos'], arquetipoKey:'estrategista'},
      {volume:'V17', eyebrow:'Série Arquétipos · 17', titulo:'O Sargento', desc:'Pra síndicos firmes que confundem autoridade com medo.', pdf:'/sargento/material.pdf', landing:'/sargento/', tags:['arquetipos'], arquetipoKey:'sargento'},
    ];

    // Card especial mostrado no lugar dos 6 arquétipos quando o membro
    // ainda não fez o quiz. Ao fazer o quiz, o backend grava perfil_nome
    // e este card é substituído pelo arquétipo correspondente.
    const QUIZ_CARD = {
      volume: 'Quiz',
      eyebrow: 'Arquétipos · Descubra seu perfil',
      titulo: 'Que tipo de síndico você é?',
      desc: 'Faça o quiz de 10 perguntas pra descobrir seu arquétipo de gestão. No fim, libero aqui o e-book do seu perfil — só pra você.',
      pdf: null,
      landing: '/quiz/',
      tags: ['arquetipos'],
      isQuiz: true,
    };

    const FILTROS = [
      {id:'todos', label:'Todos'},
      {id:'guia', label:'Guias'},
      {id:'ebook', label:'E-books'},
      {id:'manual', label:'Manuais'},
      {id:'checklist', label:'Checklists'},
      {id:'arquetipos', label:'Arquétipos'},
    ];

    // 'YYYY-MM-DD' → 'TER 01 SET 2026'
    const formatDateLabel = (iso) => {
      if (!iso) return '';
      const m = String(iso).match(/^(\d{4})-(\d{2})-(\d{2})$/);
      if (!m) return iso;
      const d = new Date(Date.UTC(parseInt(m[1]), parseInt(m[2]) - 1, parseInt(m[3])));
      const dias = ['DOM','SEG','TER','QUA','QUI','SEX','SÁB'];
      const meses = ['JAN','FEV','MAR','ABR','MAI','JUN','JUL','AGO','SET','OUT','NOV','DEZ'];
      return `${dias[d.getUTCDay()]} ${m[3]} ${meses[parseInt(m[2]) - 1]} ${m[1]}`;
    };

    const post = async (path, body) => {
      const res = await fetch(path, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(body),
      });
      const data = await res.json().catch(() => ({error: 'Resposta inválida'}));
      return {ok: res.ok, data};
    };

    const App = () => {
      // 'mode' controla qual tela mostrar antes do login:
      //  'login'   - e-mail + senha
      //  'request' - pedir link de criação/redefinição
      //  'set'     - tela de criar nova senha (vem do magic link)
      const [mode, setMode] = React.useState('login');
      const [member, setMember] = React.useState(null);
      const [loading, setLoading] = React.useState(true);

      // login form
      const [loginEmail, setLoginEmail] = React.useState('');
      const [loginPassword, setLoginPassword] = React.useState('');
      const [loginBusy, setLoginBusy] = React.useState(false);
      const [loginErr, setLoginErr] = React.useState('');

      // request form
      const [reqEmail, setReqEmail] = React.useState('');
      const [reqBusy, setReqBusy] = React.useState(false);
      const [reqSent, setReqSent] = React.useState(false);
      const [reqErr, setReqErr] = React.useState('');

      // set password form
      const [pwdToken, setPwdToken] = React.useState('');
      const [newPwd, setNewPwd] = React.useState('');
      const [confirmPwd, setConfirmPwd] = React.useState('');
      const [pwdBusy, setPwdBusy] = React.useState(false);
      const [pwdErr, setPwdErr] = React.useState('');
      const [pwdDone, setPwdDone] = React.useState(false);

      const [filtro, setFiltro] = React.useState('todos');

      // 'loggedView' controla qual tela mostrar após login: biblioteca ou perfil
      const [loggedView, setLoggedView] = React.useState('library');
      const [profileData, setProfileData] = React.useState(null);
      const [profileBusy, setProfileBusy] = React.useState(false);
      const [profileErr, setProfileErr] = React.useState('');
      const [profileMsg, setProfileMsg] = React.useState('');

      React.useEffect(() => {
        const url = new URL(window.location.href);
        const action = url.searchParams.get('action');
        const tokenFromUrl = url.searchParams.get('t');

        if (action === 'set-password' && tokenFromUrl) {
          setPwdToken(tokenFromUrl);
          setMode('set');
          setLoading(false);
          window.history.replaceState({}, '', '/membros/');
          return;
        }

        // Tenta restaurar sessão E revalida no servidor pra pegar
        // atualizações de perfil (ex.: pessoa fez o quiz desde o último
        // login — o perfil_nome precisa ser atualizado na sessão).
        try {
          const saved = sessionStorage.getItem(STORAGE_KEY);
          if (saved) {
            const data = JSON.parse(saved);
            if (data.email && data.token && data.exp && Date.now() < data.exp) {
              // Mostra a sessão imediatamente
              setMember(data);
              // E revalida em paralelo pra atualizar perfil/nome
              (async () => {
                try {
                  const {ok, data: fresh} = await post('/.netlify/functions/membros-validate', {token: data.token});
                  if (ok && fresh.ok) {
                    const next = {
                      ...data,
                      nome: fresh.nome || data.nome,
                      perfil: fresh.perfil || data.perfil || null,
                      perfil_nome: fresh.perfil_nome || data.perfil_nome || null,
                      mentoria: !!fresh.mentoria,
                      mentoriaModalidade: fresh.mentoriaModalidade || data.mentoriaModalidade || null,
                      mentoriaConfig: fresh.mentoriaConfig || data.mentoriaConfig || null,
                    };
                    sessionStorage.setItem(STORAGE_KEY, JSON.stringify(next));
                    setMember(next);
                  }
                } catch {}
              })();
            }
          }
        } catch {}
        setLoading(false);
      }, []);

      const doLogin = async (e) => {
        e.preventDefault();
        setLoginErr('');
        setLoginBusy(true);
        const {ok, data} = await post('/.netlify/functions/membros-login', {
          email: loginEmail.trim().toLowerCase(),
          password: loginPassword,
        });
        setLoginBusy(false);
        if (!ok || !data.ok) {
          setLoginErr(data.error || 'E-mail ou senha inválidos.');
          return;
        }
        const session = {
          email: data.email,
          nome: data.nome,
          token: data.token,
          perfil: data.perfil || null,
          perfil_nome: data.perfil_nome || null,
          mentoria: !!data.mentoria,
          mentoriaModalidade: data.mentoriaModalidade || null,
          mentoriaConfig: data.mentoriaConfig || null,
          exp: Date.now() + 7 * 24 * 60 * 60 * 1000,
        };
        sessionStorage.setItem(STORAGE_KEY, JSON.stringify(session));
        setMember(session);
      };

      const doRequest = async (e) => {
        e.preventDefault();
        setReqErr('');
        setReqBusy(true);
        const {ok, data} = await post('/.netlify/functions/membros-request-password', {
          email: reqEmail.trim().toLowerCase(),
        });
        setReqBusy(false);
        if (!ok) {
          setReqErr(data.error || 'Falha ao enviar. Tenta de novo.');
          return;
        }
        setReqSent(true);
      };

      const doSetPassword = async (e) => {
        e.preventDefault();
        setPwdErr('');
        if (newPwd.length < 6) { setPwdErr('A senha precisa ter pelo menos 6 caracteres.'); return; }
        if (newPwd !== confirmPwd) { setPwdErr('As senhas não coincidem.'); return; }
        setPwdBusy(true);
        const {ok, data} = await post('/.netlify/functions/membros-set-password', {
          token: pwdToken, password: newPwd,
        });
        setPwdBusy(false);
        if (!ok) {
          setPwdErr(data.error || 'Falha ao salvar a senha.');
          return;
        }
        setPwdDone(true);
      };

      const logout = () => {
        sessionStorage.removeItem(STORAGE_KEY);
        setMember(null);
        setMode('login');
        setLoggedView('library');
        setProfileData(null);
        setLoginEmail(''); setLoginPassword(''); setLoginErr('');
      };

      const openProfile = async () => {
        setLoggedView('profile');
        setProfileErr(''); setProfileMsg('');
        if (profileData) return; // já carregou nesta sessão
        setProfileBusy(true);
        const {ok, data} = await post('/.netlify/functions/membros-get-profile', {token: member.token});
        setProfileBusy(false);
        if (!ok) { setProfileErr(data.error || 'Falha ao carregar.'); return; }
        // input type=date espera YYYY-MM-DD; banco salva MM-DD-YYYY
        const raw = String(data.lead.data_nascimento || '');
        const m = raw.match(/^(\d{2})-(\d{2})-(\d{4})$/);
        const dateForInput = m ? `${m[3]}-${m[1]}-${m[2]}` : raw;
        setProfileData({...data.lead, data_nascimento: dateForInput});
      };

      const saveProfile = async (e) => {
        e.preventDefault();
        setProfileErr(''); setProfileMsg('');
        setProfileBusy(true);
        const {ok, data} = await post('/.netlify/functions/membros-update-profile', {
          token: member.token,
          ...profileData,
        });
        setProfileBusy(false);
        if (!ok) { setProfileErr(data.error || 'Falha ao salvar.'); return; }
        setProfileMsg('Cadastro atualizado.');
        // Atualiza session com o novo nome
        if (data.lead.nome !== member.nome) {
          const session = {...member, nome: data.lead.nome};
          sessionStorage.setItem(STORAGE_KEY, JSON.stringify(session));
          setMember(session);
        }
      };

      const setProfileField = (k, v) => setProfileData((d) => ({...d, [k]: v}));

      const ATUACOES = ['Síndico profissional', 'Síndico morador', 'Gestor condominial', 'Administradora', 'Conselheiro', 'Outro'];
      const UFS = ['AC','AL','AP','AM','BA','CE','DF','ES','GO','MA','MT','MS','MG','PA','PB','PR','PE','PI','RJ','RN','RS','RO','RR','SC','SP','SE','TO'];

      // Catálogo dinâmico baseado no perfil do membro:
      // - sem quiz feito → grupo Arquétipos mostra só o QUIZ_CARD
      // - quiz feito → grupo Arquétipos mostra SÓ o arquétipo correspondente
      const userPerfil = member && (member.perfil_nome || member.perfil) ? String(member.perfil_nome || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '') : null;
      const arquetipoCard = userPerfil
        ? MATERIAIS.find((m) => m.tags.includes('arquetipos') && m.arquetipoKey === userPerfil)
        : null;
      const visibleMateriais = [
        ...MATERIAIS.filter((m) => !m.tags.includes('arquetipos')),
        ...(arquetipoCard ? [arquetipoCard] : (userPerfil ? [] : [QUIZ_CARD])),
      ];
      const filtered = filtro === 'todos' ? visibleMateriais : visibleMateriais.filter((m) => m.tags.includes(filtro));

      // === LOADING ===
      if (loading) {
        return <div className="mb-login-stage"><p style={{color: 'rgba(247,245,242,0.5)', fontStyle: 'italic'}}>Carregando…</p></div>;
      }

      // === SET PASSWORD (vindo do magic link) ===
      if (mode === 'set' && !member) {
        return (
          <div className="mb-login-stage">
            <div className="mb-login-card">
              <span className="mb-login-eyebrow">Bastidores da Sindicatura</span>
              <h1 className="mb-login-title">{pwdDone ? <>Senha <em>criada.</em></> : <>Criar <em>senha.</em></>}</h1>
              {pwdDone ? (
                <>
                  <p className="mb-login-lead">
                    Sua senha foi salva. Agora você já pode entrar na Área de Membros normalmente.
                  </p>
                  <button className="mb-cta" onClick={() => { setMode('login'); setPwdDone(false); }}>
                    Ir pro login
                  </button>
                </>
              ) : (
                <>
                  <p className="mb-login-lead">
                    Escolha uma senha pra usar daqui pra frente quando entrar na Área de Membros. Mínimo de 6 caracteres.
                  </p>
                  <form onSubmit={doSetPassword}>
                    <label className="mb-field">
                      <span className="mb-label">Nova senha</span>
                      <input className="mb-input" type="password" value={newPwd} onChange={(e) => setNewPwd(e.target.value)} required minLength={6} autoComplete="new-password" />
                    </label>
                    <label className="mb-field">
                      <span className="mb-label">Confirmar nova senha</span>
                      <input className="mb-input" type="password" value={confirmPwd} onChange={(e) => setConfirmPwd(e.target.value)} required minLength={6} autoComplete="new-password" />
                    </label>
                    <button type="submit" className="mb-cta" disabled={pwdBusy}>
                      {pwdBusy ? 'Salvando…' : 'Salvar senha'}
                    </button>
                    {pwdErr && <div className="mb-msg-err">{pwdErr}</div>}
                  </form>
                </>
              )}
            </div>
          </div>
        );
      }

      // === REQUEST (pedir magic link pra criar/redefinir senha) ===
      if (mode === 'request' && !member) {
        return (
          <div className="mb-login-stage">
            <div className="mb-login-card">
              <span className="mb-login-eyebrow">Bastidores da Sindicatura</span>
              <h1 className="mb-login-title">Criar/redefinir <em>senha.</em></h1>
              <p className="mb-login-lead">
                Informe o e-mail que você usou pra se cadastrar. A gente envia um link pra você escolher uma senha nova.
              </p>
              <form onSubmit={doRequest}>
                <label className="mb-field">
                  <span className="mb-label">Seu e-mail</span>
                  <input className="mb-input" type="email" value={reqEmail} onChange={(e) => setReqEmail(e.target.value)} required disabled={reqSent} />
                </label>
                <button type="submit" className="mb-cta" disabled={reqBusy || reqSent}>
                  {reqBusy ? 'Enviando…' : reqSent ? 'Link enviado' : 'Enviar link de criação'}
                </button>
                {reqSent && (
                  <div className="mb-msg-ok">
                    Se este e-mail estiver cadastrado, você vai receber um link em alguns minutos. Confira a caixa de entrada (e o spam). O link expira em 30 minutos.
                  </div>
                )}
                {reqErr && <div className="mb-msg-err">{reqErr}</div>}
              </form>
              <div className="mb-link-row">
                <button className="mb-link" onClick={() => setMode('login')}>← Voltar pro login</button>
              </div>
            </div>
          </div>
        );
      }

      // === LOGIN ===
      if (!member) {
        return (
          <div className="mb-login-stage">
            <div className="mb-login-card">
              <span className="mb-login-eyebrow">Bastidores da Sindicatura</span>
              <h1 className="mb-login-title">Área de <em>Membros.</em></h1>
              <p className="mb-login-lead">
                Acesse com seu e-mail cadastrado e a senha que você escolheu.
              </p>
              <form onSubmit={doLogin}>
                <label className="mb-field">
                  <span className="mb-label">E-mail</span>
                  <input className="mb-input" type="email" value={loginEmail} onChange={(e) => setLoginEmail(e.target.value)} placeholder="seu@email.com" required autoComplete="email" />
                </label>
                <label className="mb-field">
                  <span className="mb-label">Senha</span>
                  <input className="mb-input" type="password" value={loginPassword} onChange={(e) => setLoginPassword(e.target.value)} placeholder="••••••" required autoComplete="current-password" />
                </label>
                <button type="submit" className="mb-cta" disabled={loginBusy}>
                  {loginBusy ? 'Entrando…' : 'Entrar'}
                </button>
                {loginErr && <div className="mb-msg-err">{loginErr}</div>}
              </form>
              <div className="mb-link-row">
                <button className="mb-link" onClick={() => setMode('request')}>Criar / esqueci minha senha</button>
                <a href="/" className="mb-link" style={{textDecoration: 'none'}}>← Voltar pro site</a>
              </div>
            </div>
          </div>
        );
      }

      // === ÁREA LOGADA ===
      const firstName = String(member.nome || '').trim().split(/\s+/)[0] || 'aí';

      const MentoriaBanner = () => (
        <section className="mb-mentoria-banner">
          <div className="mb-mentoria-text">
            <span className="mb-mentoria-eyebrow">Mentoria Executiva · Turma 01 · 2026</span>
            <h2 className="mb-mentoria-title">Quer ir <em>além</em> dos materiais?</h2>
            <p className="mb-mentoria-lead">
              A Mentoria Bastidores da Sindicatura é pra quem decidiu profissionalizar a gestão de vez. Encontros semanais, método estruturado e uma comunidade pequena que se conhece. Vagas limitadas.
            </p>
          </div>
          <a className="mb-mentoria-cta" href="/#contato">
            Reservar minha aplicação
            <svg width="14" height="10" viewBox="0 0 18 12" fill="none">
              <path d="M1 6h15M11 1l5 5-5 5" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
            </svg>
          </a>
        </section>
      );

      return (
        <div className="mb-shell">
          <header className="mb-topbar">
            <div className="mb-brand">
              <span className="mb-brand-l1">Bastidores da Sindicatura</span>
              <span className="mb-brand-l2">Área de Membros</span>
            </div>
            <div className="mb-user">
              <nav className="mb-nav">
                <button className={'mb-nav-link' + (loggedView === 'library' ? ' is-on' : '')} onClick={() => setLoggedView('library')}>Biblioteca</button>
                <button className={'mb-nav-link' + (loggedView === 'profile' ? ' is-on' : '')} onClick={openProfile}>Meu cadastro</button>
              </nav>
              <span className="mb-user-name">Olá, <strong>{firstName}</strong></span>
              <button
                className="mb-logout"
                title="Atualizar dados do cadastro (perfil, mentoria, modalidade)"
                onClick={async () => {
                  try {
                    const {ok, data: fresh} = await post('/.netlify/functions/membros-validate', {token: member.token});
                    if (ok && fresh.ok) {
                      const next = {
                        ...member,
                        nome: fresh.nome || member.nome,
                        perfil: fresh.perfil || null,
                        perfil_nome: fresh.perfil_nome || null,
                        mentoria: !!fresh.mentoria,
                        mentoriaModalidade: fresh.mentoriaModalidade || null,
                        mentoriaConfig: fresh.mentoriaConfig || member.mentoriaConfig || null,
                      };
                      sessionStorage.setItem(STORAGE_KEY, JSON.stringify(next));
                      setMember(next);
                    }
                  } catch {}
                }}
              >↻ Atualizar</button>
              <button className="mb-logout" onClick={logout}>Sair</button>
            </div>
          </header>

          <MentoriaBanner />

          {/* Área da Mentoria · sempre visível pra TODOS os membros.
              Liberada se member.mentoria === true; senão aparece com
              cadeado e mensagem 'em breve'. */}
          <div className="mb-mentoria-area">
            <span className="mb-mentoria-area-eyebrow">Mentoria · Turma 01 · 2026</span>
            <h2 className="mb-mentoria-area-title">Sala <em>ao vivo.</em></h2>
            <div className={'mb-mentoria-card ' + (member.mentoria ? 'is-active' : 'is-locked')}>
              <div className="mb-mentoria-card-info">
                <div className="mb-mentoria-icon">
                  {member.mentoria ? '✓' : '🔒'}
                </div>
                <div className="mb-mentoria-card-text">
                  <span className="mb-mentoria-card-eyebrow">
                    {member.mentoria ? 'Acesso liberado' : 'Acesso bloqueado'}
                  </span>
                  <p className="mb-mentoria-card-name">
                    {member.mentoria ? 'Sala da Mentoria · Microsoft Teams' : 'Sala da Mentoria · Em breve'}
                  </p>
                  <p className="mb-mentoria-card-desc">
                    {member.mentoria ? (
                      <>
                        Você está inscrito(a) na Turma 01 · <strong style={{color: 'var(--sand)'}}>Modalidade {member.mentoriaModalidade === 'executive' ? 'Executive' : 'Experience'}</strong>.
                        Encontros ao vivo
                        {member.mentoriaConfig && member.mentoriaConfig.horario && <> · <strong>{member.mentoriaConfig.horario}</strong></>}.
                        {member.mentoriaModalidade === 'executive' && <> Inclui 2 sessões particulares.</>}
                        {member.mentoriaConfig && member.mentoriaConfig.notes && <> {member.mentoriaConfig.notes}</>}
                      </>
                    ) : (
                      'Esta área é exclusiva pra quem se inscreveu na Mentoria Bastidores da Sindicatura. Quando você confirmar sua vaga, esta sala libera automaticamente.'
                    )}
                  </p>
                </div>
              </div>
              {member.mentoria && member.mentoriaConfig && member.mentoriaConfig.teamsLink ? (
                <a className="mb-mentoria-card-cta" href={member.mentoriaConfig.teamsLink} target="_blank" rel="noreferrer">
                  Entrar no Teams
                  <svg width="12" height="10" viewBox="0 0 18 12" fill="none">
                    <path d="M1 6h15M11 1l5 5-5 5" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
                  </svg>
                </a>
              ) : member.mentoria ? (
                <span className="mb-mentoria-card-cta" style={{opacity: 0.7}}>
                  Link em breve
                </span>
              ) : (
                <span className="mb-mentoria-card-cta">
                  Bloqueado
                  <svg width="12" height="12" viewBox="0 0 16 16" fill="none">
                    <path d="M4 7V5a4 4 0 018 0v2m-9 0h10v8H3V7z" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round"/>
                  </svg>
                </span>
              )}
            </div>

            {/* Cronograma das aulas · sempre visivel pra todo membro
                logado. Pra inscritos: aulas abertas, com link ao vivo
                no dia, gravacoes depois. Pra nao-inscritos: teaser com
                as datas reais visiveis (mostra que a turma esta pronta)
                + CTA pra reservar a vaga. Filtra particulares pra quem
                NAO eh Executive (mostra como bloqueada com selo "so
                Executive"). */}
            {member.mentoriaConfig && Array.isArray(member.mentoriaConfig.aulas) && member.mentoriaConfig.aulas.length > 0 && (() => {
              const isInscrito = !!member.mentoria;
              const isExecutive = member.mentoriaModalidade === 'executive';
              // Inscritos Experience nao veem particulares. Nao-inscritos
              // veem so as de grupo (12) como teaser.
              const visibleAulas = member.mentoriaConfig.aulas.filter((a) => isExecutive || a.tipo !== 'particular');
              const today = new Date().toISOString().slice(0, 10);
              const aulasFuturas = visibleAulas.filter((a) => a.data >= today).length;
              return (
                <div className="mb-aulas-grid">
                  <div className="mb-aulas-head">
                    <span className="mb-aulas-eyebrow">
                      Cronograma · {visibleAulas.length} aulas{isInscrito ? ' · ' + (isExecutive ? 'Executive' : 'Experience') : ''}
                    </span>
                    <h3 className="mb-aulas-title">Calendário das <em>aulas.</em></h3>
                    <p style={{margin: '8px 0 0', fontSize: 13, lineHeight: 1.5, color: 'rgba(247,245,242,0.6)'}}>
                      {isInscrito ? (
                        <>
                          Aulas em grupo · <strong style={{color: 'var(--sand)'}}>{member.mentoriaConfig.horario || 'Terças, 07h30 às 09h00 (Brasília)'}</strong>.
                          {isExecutive && (
                            <> Particulares · <strong style={{color: 'var(--sand)'}}>{member.mentoriaConfig.horarioParticular || 'Horário individual a combinar'}</strong>.</>
                          )}
                        </>
                      ) : (
                        <>
                          Turma 01 começa em <strong style={{color: 'var(--sand)'}}>setembro de 2026</strong> · <strong style={{color: 'var(--sand)'}}>{member.mentoriaConfig.horario || 'Terças, 07h30 às 09h00 (Brasília)'}</strong>. {aulasFuturas} {aulasFuturas === 1 ? 'aula' : 'aulas'} confirmadas no calendário abaixo — quando você garantir sua vaga, tudo isto aqui desbloqueia.
                        </>
                      )}
                    </p>
                  </div>
                  <div className="mb-aulas-list">
                    {visibleAulas.map((aula, i) => {
                      const isPast = aula.data < today;
                      const isToday = aula.data === today;
                      const isUpcoming = aula.data > today;
                      const hasRecording = !!(aula.recordingLink && String(aula.recordingLink).trim());
                      const dateLabel = formatDateLabel(aula.data);
                      const isParticular = aula.tipo === 'particular';
                      const horarioLabel = isParticular
                        ? (member.mentoriaConfig.horarioParticular || 'Individual')
                        : '07h30 às 09h00';
                      // Para Experience, as particulares de Executive (se
                      // visiveis em algum momento) sao locked. Aqui ja
                      // filtramos pra so Executive ver particulares, entao
                      // se aparecer particular = a pessoa eh Executive.
                      return (
                        <div key={i} className={
                          'mb-aula'
                          + (!isInscrito ? ' is-locked' : '')
                          + (isToday && isInscrito ? ' is-today' : '')
                          + (hasRecording && isInscrito ? ' has-recording' : '')
                          + (isParticular ? ' is-particular' : '')
                        }>
                          <div className="mb-aula-date">
                            <span className="mb-aula-num">{isParticular ? 'PARTICULAR' : `Aula ${String(i + 1).padStart(2, '0')}`}</span>
                            <span className="mb-aula-day">{dateLabel}</span>
                            <span className="mb-aula-horario">{horarioLabel}</span>
                          </div>
                          <div className="mb-aula-content">
                            <p className="mb-aula-title">{aula.titulo || `Aula ${aula.numero}`}</p>
                            {aula.descricao && <p className="mb-aula-desc">{aula.descricao}</p>}
                          </div>
                          <div className="mb-aula-action">
                            {!isInscrito ? (
                              <span className="mb-aula-status is-locked">
                                <svg width="11" height="11" viewBox="0 0 16 16" fill="none">
                                  <path d="M4 7V5a4 4 0 018 0v2m-9 0h10v8H3V7z" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round"/>
                                </svg>
                                Bloqueado
                              </span>
                            ) : isToday && member.mentoriaConfig.teamsLink ? (
                              <a href={member.mentoriaConfig.teamsLink} target="_blank" rel="noreferrer" className="mb-aula-cta is-live">
                                Entrar agora →
                              </a>
                            ) : hasRecording ? (
                              <a href={aula.recordingLink} target="_blank" rel="noreferrer" className="mb-aula-cta is-recording">
                                ▶ Assistir gravação
                              </a>
                            ) : isPast ? (
                              <span className="mb-aula-status is-pending">Gravação em breve</span>
                            ) : isUpcoming ? (
                              <span className="mb-aula-status is-future">Em breve</span>
                            ) : null}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                  {!isInscrito && (
                    <div className="mb-aulas-cta-locked">
                      <p className="mb-aulas-cta-locked-text">
                        <strong style={{color: 'var(--sand)'}}>Garanta sua vaga na Mentoria</strong> pra liberar o calendário completo, entrar nas aulas ao vivo no Teams e assistir as gravações depois.
                      </p>
                      <a className="mb-aulas-cta-locked-btn" href="/#contato">
                        Reservar minha vaga
                        <svg width="12" height="10" viewBox="0 0 18 12" fill="none">
                          <path d="M1 6h15M11 1l5 5-5 5" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
                        </svg>
                      </a>
                    </div>
                  )}
                </div>
              );
            })()}
          </div>

          {loggedView === 'library' && (
            <>
              <section className="mb-hero">
                <span className="mb-hero-eyebrow">{visibleMateriais.length} materiais disponíveis pra você</span>
                <h1 className="mb-hero-title">A sua <em>biblioteca.</em></h1>
                <p className="mb-hero-lead">
                  Aqui está tudo que publicamos até hoje. Clica num card pra abrir o PDF ou ver a página completa.
                  {userPerfil && arquetipoCard && <> O e-book do seu arquétipo <em>{arquetipoCard.titulo}</em> também está liberado abaixo.</>}
                  {!userPerfil && <> O e-book da série Arquétipos é liberado depois que você faz o quiz.</>}
                </p>
              </section>

              <div className="mb-filters">
                {FILTROS.map((f) => (
                  <button key={f.id} className={'mb-filter' + (filtro === f.id ? ' is-on' : '')} onClick={() => setFiltro(f.id)}>{f.label}</button>
                ))}
              </div>

              <div className="mb-grid">
                {filtered.length === 0 && <p className="mb-empty">Nenhum material nesta categoria ainda.</p>}
                {filtered.map((m) => (
                  <article key={m.volume} className="mb-card" style={m.isQuiz ? {borderColor: 'rgba(218,189,169,0.5)'} : {}}>
                    <span className="mb-card-volume">{m.volume}</span>
                    <span className="mb-card-eyebrow">{m.eyebrow}</span>
                    <h2 className="mb-card-title">{m.titulo}</h2>
                    <p className="mb-card-desc">{m.desc}</p>
                    <div className="mb-card-actions">
                      {m.isQuiz ? (
                        <a className="mb-card-btn" href={m.landing} target="_blank" rel="noreferrer" style={{background: 'var(--sand)', color: 'var(--onix)', border: '1px solid var(--sand)'}}>
                          Fazer o Quiz
                          <svg width="12" height="10" viewBox="0 0 18 12" fill="none">
                            <path d="M1 6h15M11 1l5 5-5 5" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
                          </svg>
                        </a>
                      ) : (
                        <>
                          <a className="mb-card-btn" href={m.pdf} target="_blank" rel="noreferrer">
                            Abrir PDF
                            <svg width="12" height="10" viewBox="0 0 18 12" fill="none">
                              <path d="M1 6h15M11 1l5 5-5 5" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
                            </svg>
                          </a>
                          {m.landing && (
                            <a className="mb-card-btn is-secondary" href={m.landing} target="_blank" rel="noreferrer">
                              Página
                            </a>
                          )}
                        </>
                      )}
                    </div>
                  </article>
                ))}
              </div>
            </>
          )}

          {loggedView === 'profile' && (
            <>
              <section className="mb-hero">
                <span className="mb-hero-eyebrow">Atualizar dados</span>
                <h1 className="mb-hero-title">Meu <em>cadastro.</em></h1>
                <p className="mb-hero-lead">
                  Mantém seus dados atualizados pra continuar recebendo os materiais e novidades certas. O e-mail é a sua chave de acesso e não pode ser alterado por aqui.
                </p>
              </section>

              <div className="mb-profile-wrap">
                <div className="mb-profile-card">
                  {profileBusy && !profileData && <p className="mb-empty">Carregando seu cadastro…</p>}
                  {profileErr && <div className="mb-msg-err" style={{marginBottom: 20}}>{profileErr}</div>}
                  {profileData && (
                    <form onSubmit={saveProfile}>
                      <p className="mb-profile-meta">
                        <strong>E-mail:</strong> {profileData.email}
                        {profileData.createdAt && <> · Cadastro de {new Date(profileData.createdAt).toLocaleDateString('pt-BR')}</>}
                      </p>

                      <label className="mb-field">
                        <span className="mb-label">Nome completo</span>
                        <input className="mb-input" type="text" value={profileData.nome} onChange={(e) => setProfileField('nome', e.target.value)} required />
                      </label>

                      <div className="mb-profile-row mb-profile-section">
                        <label className="mb-field">
                          <span className="mb-label">Cidade</span>
                          <input className="mb-input" type="text" value={profileData.cidade} onChange={(e) => setProfileField('cidade', e.target.value)} />
                        </label>
                        <label className="mb-field">
                          <span className="mb-label">Estado (UF)</span>
                          <select className="mb-select" value={profileData.estado} onChange={(e) => setProfileField('estado', e.target.value)}>
                            <option value="">UF</option>
                            {UFS.map((u) => <option key={u} value={u}>{u}</option>)}
                          </select>
                        </label>
                      </div>

                      <div className="mb-profile-row mb-profile-section">
                        <label className="mb-field">
                          <span className="mb-label">WhatsApp</span>
                          <input className="mb-input" type="tel" value={profileData.whatsapp} onChange={(e) => setProfileField('whatsapp', e.target.value)} placeholder="(11) 99999-9999" />
                        </label>
                        <label className="mb-field">
                          <span className="mb-label">Instagram</span>
                          <input className="mb-input" type="text" value={profileData.instagram} onChange={(e) => setProfileField('instagram', e.target.value.replace(/^@+/, ''))} placeholder="seuusuario" />
                        </label>
                      </div>

                      <div className="mb-profile-row mb-profile-section">
                        <label className="mb-field">
                          <span className="mb-label">Atuação</span>
                          <select className="mb-select" value={profileData.atuacao} onChange={(e) => setProfileField('atuacao', e.target.value)}>
                            <option value="">Selecione</option>
                            {ATUACOES.map((a) => <option key={a} value={a}>{a}</option>)}
                          </select>
                        </label>
                        <label className="mb-field">
                          <span className="mb-label">Data de nascimento</span>
                          <input className="mb-input" type="date" value={profileData.data_nascimento} onChange={(e) => setProfileField('data_nascimento', e.target.value)} />
                        </label>
                      </div>

                      <button type="submit" className="mb-cta" disabled={profileBusy}>
                        {profileBusy ? 'Salvando…' : 'Salvar alterações'}
                      </button>

                      {profileMsg && <div className="mb-msg-ok">{profileMsg}</div>}
                      {profileErr && <div className="mb-msg-err">{profileErr}</div>}
                    </form>
                  )}
                </div>
              </div>
            </>
          )}
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
