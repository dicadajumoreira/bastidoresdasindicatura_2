<body>

  <script type="text/babel">
    const SorteioMBALanding = () => {
      const [data, setData] = React.useState(() => {
        const defaults = {nome: '', cidade: '', estado: '', whatsapp: '', email: '', instagram: '', atuacao: ''};
        try {
          const saved = JSON.parse(localStorage.getItem('bs-lead') || '{}');
          return {...defaults, ...Object.fromEntries(Object.entries(saved).filter(([k]) => k in defaults))};
        } catch { return defaults; }
      });
      const [ensinoSuperior, setEnsinoSuperior] = React.useState(false);
      const [submitting, setSubmitting] = React.useState(false);
      const [error, setError] = React.useState('');
      const [sucesso, setSucesso] = React.useState(false);

      const setField = (k, v) => setData((d) => ({...d, [k]: v}));

      const UFS = ['AC','AL','AP','AM','BA','CE','DF','ES','GO','MA','MT','MS','MG','PA','PB','PR','PE','PI','RJ','RN','RS','RO','RR','SC','SP','SE','TO'];

      const canSend = data.nome && data.cidade && data.estado && data.whatsapp && data.email && data.instagram && data.atuacao && ensinoSuperior && !submitting;

      const submit = async (e) => {
        e.preventDefault();
        if (!canSend) return;
        setSubmitting(true);
        setError('');

        const payload = {
          ...data,
          origem: 'sorteio-mba',
          ensino_superior_completo: true,
        };

        let ok = false;
        try {
          const res = await fetch('/.netlify/functions/submit', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(payload),
          });
          ok = res.ok;
        } catch (err) { /* trata abaixo */ }

        // Envia também para Netlify Forms (notificação por e-mail)
        try {
          const fd = new URLSearchParams();
          fd.append('form-name', 'sorteio-mba-aplicacao');
          Object.entries(payload).forEach(([k, v]) => fd.append(k, v == null ? '' : String(v)));
          await fetch('/', {
            method: 'POST',
            headers: {'Content-Type': 'application/x-www-form-urlencoded'},
            body: fd.toString(),
          });
        } catch (err) {}

        if (ok) {
          try { localStorage.setItem('bs-lead', JSON.stringify(data)); } catch {}
          if (typeof window.fbq === 'function') {
            window.fbq('track', 'Lead', {
              content_name: 'Sorteio MBA IBMEC',
              content_category: 'Sorteio · MBA',
            });
          }
          setSucesso(true);
          setSubmitting(false);
        } else {
          setError('Não conseguimos registrar agora. Tente novamente em instantes, por favor.');
          setSubmitting(false);
        }
      };

      return (
        <div className="ck-stage">
          <div className="ck-root bs-root">

              <a href="/" className="ck-back">

                  <path d="M17 6H2M7 1L2 6l5 5" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
                </svg>
                <span>Voltar à mentoria</span>
              </a>
              <div className="ck-topbar-brand">
                <span className="ck-topbar-brand-l1">Bastidores da Sindicatura</span>
                <span className="ck-topbar-brand-l2">Sorteio MBA Executivo · IBMEC</span>
              </div>
            </header>

            {/* Hero */}
            <section className="ck-hero">
              <div className="ck-hero-text">
                <div className="ck-hero-eyebrow">
                  <span className="bs-rule"></span>
                  <span className="bs-eyebrow">Concurso · Patrocínio Condo Academy · MBA Executivo</span>
                </div>

                <h1 className="ck-hero-title">
                  <span className="l1">Concorra.</span>
                  <span className="l2">Uma bolsa.</span>
                  <span className="l3">MBA pela IBMEC.</span>
                </h1>

                <div className="ck-mba-patrocinio">
                  <img
                    src="/assets/condo-academy-logo.png"
                    alt="Condo Academy"
                    className="ck-mba-patrocinio-logo"
                  />
                  <p className="ck-mba-patrocinio-text">
                    <em>Um patrocínio</em> <strong>Condo Academy</strong>{' '}
                    <em>em parceria com a</em> <strong>IBMEC</strong>
                  </p>
                </div>

                <p className="ck-hero-lead">
                  A Condo Academy sorteia uma <strong>bolsa integral</strong>{' '}
                  do MBA Executivo em Gestão Condominial. Inscrições abertas
                  até <strong>12 de junho de 2026</strong>. A turma começa{' '}
                  <strong>semana que vem</strong>. Carga de 360 horas,{' '}
                  <em>certificado IBMEC</em>.
                </p>

                <div className="ck-hero-meta">
                  <div className="ck-meta-item">
                    <span className="ck-meta-k">Inscrições até</span>
                    <span className="ck-meta-v">12/06</span>
                  </div>
                  <div className="ck-meta-item">
                    <span className="ck-meta-k">Carga horária</span>
                    <span className="ck-meta-v">360h</span>
                  </div>
                  <div className="ck-meta-item">
                    <span className="ck-meta-k">Duração</span>
                    <span className="ck-meta-v"><em>12 meses</em></span>
                  </div>
                </div>
              </div>

              <div className="ck-form-wrap">
                {sucesso ? (
                  <div className="ck-mba-success">
                    <span className="ck-form-tag">Inscrição confirmada</span>
                    <h2 className="ck-form-title">Boa sorte.</h2>
                    <p className="ck-form-sub">
                      Recebemos o seu cadastro. O sorteio da bolsa integral acontece
                      em <strong>13/06/2026</strong> e o resultado vai pro seu
                      WhatsApp.
                    </p>
                    <div className="ck-mba-success-mark">
                      <svg width="44" height="44" viewBox="0 0 44 44" fill="none">
                        <circle cx="22" cy="22" r="20" stroke="currentColor" strokeWidth="1.5"/>
                        <path d="M14 22.5l5.5 5.5L30 16" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/>
                      </svg>
                    </div>
                    <p className="ck-micro">
                      <em>Patrocínio Condo Academy · Certificação IBMEC</em>
                    </p>
                  </div>
                ) : (
                  <>
                    <div className="ck-form-head">
                      <span className="ck-form-tag">Inscrição no sorteio</span>
                      <h2 className="ck-form-title">Quero concorrer.</h2>
                      <p className="ck-form-sub">
                        Preencha rapidamente. Sorteio em <strong>13/06/2026</strong>,
                        resultado pelo WhatsApp.
                      </p>
                    </div>

                    <form onSubmit={submit}>
                      <label className="ck-field">
                        <span className="ck-label">Nome completo</span>
                        <input type="text" required value={data.nome} onChange={(e) => setField('nome', e.target.value)} placeholder="Como devo te chamar?" />
                      </label>
                      <div className="ck-row">
                        <label className="ck-field">
                          <span className="ck-label">Cidade</span>
                          <input type="text" required value={data.cidade} onChange={(e) => setField('cidade', e.target.value)} placeholder="Sua cidade" />
                        </label>
                        <label className="ck-field">
                          <span className="ck-label">Estado</span>
                          <select required value={data.estado} onChange={(e) => setField('estado', e.target.value)}>
                            <option value="" disabled>UF</option>
                            {UFS.map((uf) => <option key={uf} value={uf}>{uf}</option>)}
                          </select>
                        </label>
                      </div>
                      <label className="ck-field">
                        <span className="ck-label">WhatsApp</span>
                        <input type="tel" required value={data.whatsapp} onChange={(e) => setField('whatsapp', e.target.value)} placeholder="(11) 99999-9999" />
                      </label>
                      <label className="ck-field">
                        <span className="ck-label">E-mail</span>
                        <input type="email" required value={data.email} onChange={(e) => setField('email', e.target.value)} placeholder="seu@email.com" />
                      </label>
                      <label className="ck-field">
                        <span className="ck-label">@ nas redes sociais</span>
                        <input type="text" required value={data.instagram} onChange={(e) => setField('instagram', e.target.value)} placeholder="@seuuser" />
                      </label>
                      <label className="ck-field">
                        <span className="ck-label">Atua hoje como</span>
                        <select required value={data.atuacao} onChange={(e) => setField('atuacao', e.target.value)}>
                          <option value="" disabled>Selecione</option>
                          <option>Síndico profissional</option>
                          <option>Síndico morador</option>
                          <option>Gestor condominial</option>
                          <option>Administradora</option>
                          <option>Conselheiro</option>
                          <option>Outro</option>
                        </select>
                      </label>

                      <label className="ck-checkbox">
                        <input type="checkbox" required checked={ensinoSuperior} onChange={(e) => setEnsinoSuperior(e.target.checked)} />
                        <span className="ck-checkbox-box" aria-hidden="true">
                          <svg width="12" height="9" viewBox="0 0 12 9" fill="none">
                            <path d="M1 4.5l3.5 3.5L11 1" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/>
                          </svg>
                        </span>
                        <span className="ck-checkbox-text">
                          Declaro que tenho <strong>ensino superior completo</strong> (Tecnólogo, Bacharelado ou Licenciatura, com colação de grau). Pré-requisito obrigatório do MBA.
                        </span>
                      </label>

                      <button type="submit" className="ck-cta" disabled={!canSend}>
                        <span>{submitting ? 'Enviando…' : 'Quero concorrer à bolsa'}</span>
                        {!submitting && (
                          <svg width="18" height="12" viewBox="0 0 18 12" fill="none">
                            <path d="M1 6h15M11 1l5 5-5 5" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
                          </svg>
                        )}
                      </button>

                      {error && <p className="ck-error">{error}</p>}

                      <p className="ck-micro">
                        Sorteio em 13/06/2026. Resultado pelo WhatsApp informado.
                      </p>
                    </form>
                  </>
                )}
              </div>
            </section>

            {/* Grade curricular */}
            <section className="ck-mba-grade">
              <header className="ck-mba-grade-head">
                <span className="bs-eyebrow" style={{color: 'var(--sand)'}}>Grade curricular · 12 meses · 360 horas</span>
                <h2 className="ck-mba-grade-title">
                  O que você vai{' '}
                  <em>estudar.</em>
                </h2>
                <p className="ck-mba-grade-lead">
                  Seis módulos pensados pra elevar a sindicatura ao patamar
                  executivo. Estratégia, pessoa, jurídico, manutenção, finança
                  e operação. Tudo o que cabe numa carreira.
                </p>
              </header>

              <div className="ck-mba-grade-grid">
                <article className="ck-mba-card">
                  <span className="ck-mba-card-no">01</span>
                  <h3 className="ck-mba-card-title">Estratégia de mercado</h3>
                  <span className="ck-mba-card-hours">44 horas</span>
                  <ul className="ck-mba-card-list">
                    <li>Ecossistema do negócio</li>
                    <li>Geração de valor no condomínio</li>
                    <li>Ferramentas de comunicação</li>
                    <li>Branding e mídias sociais</li>
                  </ul>
                </article>

                <article className="ck-mba-card">
                  <span className="ck-mba-card-no">02</span>
                  <h3 className="ck-mba-card-title">Pessoas e equipe</h3>
                  <span className="ck-mba-card-hours">56 horas</span>
                  <ul className="ck-mba-card-list">
                    <li>Inteligência emocional</li>
                    <li>Liderança de equipes</li>
                    <li>Negociação e resolução de conflitos</li>
                    <li>Tomada de decisão complexa</li>
                  </ul>
                </article>

                <article className="ck-mba-card">
                  <span className="ck-mba-card-no">03</span>
                  <h3 className="ck-mba-card-title">Aspectos jurídicos</h3>
                  <span className="ck-mba-card-hours">64 horas</span>
                  <ul className="ck-mba-card-list">
                    <li>Leis de incorporação e do condomínio</li>
                    <li>Problemas recorrentes em condomínios</li>
                    <li>Elaboração e gestão de contratos</li>
                    <li>Riscos jurídicos do síndico</li>
                  </ul>
                </article>

                <article className="ck-mba-card">
                  <span className="ck-mba-card-no">04</span>
                  <h3 className="ck-mba-card-title">Estrutura de manutenção</h3>
                  <span className="ck-mba-card-hours">56 horas</span>
                  <ul className="ck-mba-card-list">
                    <li>Normas técnicas e certificações</li>
                    <li>Manutenção predial preventiva</li>
                    <li>Sistemas de prevenção a incêndio</li>
                    <li>Programa de prevenção de acidentes</li>
                  </ul>
                </article>

                <article className="ck-mba-card">
                  <span className="ck-mba-card-no">05</span>
                  <h3 className="ck-mba-card-title">Financeiro</h3>
                  <span className="ck-mba-card-hours">52 horas</span>
                  <ul className="ck-mba-card-list">
                    <li>Planejamento orçamentário</li>
                    <li>KPIs e análise de resultados</li>
                    <li>Prestação de contas</li>
                    <li>Gestão de investimentos e reservas</li>
                  </ul>
                </article>

                <article className="ck-mba-card">
                  <span className="ck-mba-card-no">06</span>
                  <h3 className="ck-mba-card-title">Operações e serviços</h3>
                  <span className="ck-mba-card-hours">64 horas</span>
                  <ul className="ck-mba-card-list">
                    <li>Tecnologias aplicadas à gestão condominial</li>
                    <li>IoT e automação residencial</li>
                    <li>Big Data e analytics</li>
                    <li>Gestão da mudança tecnológica</li>
                  </ul>
                </article>
              </div>
            </section>

            {/* Selo de parceria */}
            <section className="ck-mba-parceria">
              <span className="bs-eyebrow" style={{color: 'var(--sand)'}}>Patrocínio · Parceria educacional</span>
              <div className="ck-mba-parceria-marks">
                <div className="ck-mba-parceria-item">
                  <div className="ck-mba-parceria-mark ck-mba-parceria-mark-dark">
                    <img src="/assets/condo-academy-logo.png" alt="Condo Academy" />
                  </div>
                  <span className="ck-mba-parceria-tag">Patrocinador</span>
                </div>
                <span className="ck-mba-parceria-x" aria-hidden="true">×</span>
                <div className="ck-mba-parceria-item">
                  <div className="ck-mba-parceria-mark ck-mba-parceria-mark-light">
                    <img src="/assets/ibmec-logo.png" alt="IBMEC" />
                  </div>
                  <span className="ck-mba-parceria-tag">Certificação</span>
                </div>
              </div>
              <p className="ck-mba-parceria-text">
                MBA Executivo em Gestão Condominial. <em>Patrocínio Condo Academy, certificação IBMEC.</em>
              </p>
            </section>

            {/* Footer block */}
            <div className="ck-footer-block">
              <p className="ck-footer-text">
                "A Condo Academy acredita que sindicatura é{' '}
                <em>carreira.</em> Por isso patrocina o MBA Executivo em
                parceria com a IBMEC. Pra elevar o nível da{' '}
                <em>profissão inteira.</em>"

              <div className="ck-footer-brand">

  </script>
