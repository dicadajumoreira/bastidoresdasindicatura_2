<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bastidores da Sindicatura · por Juliana Moreira</title>
  <meta name="description" content="Mentoria executiva de doze semanas para síndicos profissionais. Os bastidores reais da vida condominial. Nem tudo vai para a ata." />

  <link rel="stylesheet" href="tokens.css" />
  <link rel="stylesheet" href="bastidores.css" />
  <link rel="stylesheet" href="responsive.css" />

  <style>
    html, body { margin: 0; padding: 0; background: var(--onix); min-height: 100vh; }
    body { font-family: var(--font-sans); -webkit-font-smoothing: antialiased; }
    #root { min-height: 100vh; }

    /* Centraliza o artboard 1440 no viewport */
    .bs-stage {
      display: flex;
      justify-content: center;
      background: var(--onix);
      min-height: 100vh;
    }
    .bs-stage .bs-root { box-shadow: 0 30px 80px rgba(0, 0, 0, 0.4); }

    /* Em telas menores que 1440, o stage não centraliza com letterbox — o root flui */
    @media (max-width: 1440px) {
      .bs-stage { padding: 0; }
      .bs-stage .bs-root { box-shadow: none; }
    }
  </style>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <!--
    Form est\u00e1tico (oculto) para o Netlify Forms detectar no momento do build
    e provisionar o endpoint. O envio real \u00e9 feito por AJAX em bs-form.jsx.
  -->
  <form name="bastidores-aplicacao" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="text" name="bot-field" />
    <input type="text" name="nome" />
    <input type="text" name="cidade" />
    <input type="text" name="whatsapp" />
    <input type="email" name="email" />
    <input type="text" name="instagram" />
    <input type="text" name="atuacao" />
    <input type="text" name="tempoMercado" />
    <input type="text" name="qtdCondominios" />
    <textarea name="maiorDesafio"></textarea>
    <textarea name="desgaste"></textarea>
    <input type="text" name="areas" />
    <textarea name="desenvolvimento"></textarea>
    <textarea name="objetivo"></textarea>
    <textarea name="onde2anos"></textarea>
    <textarea name="bastidor"></textarea>
    <input type="text" name="modalidade" />
  </form>

  <script type="text/babel" src="bs-hero.jsx"></script>
  <script type="text/babel" src="bs-manifesto.jsx"></script>
  <script type="text/babel" src="bs-sobre.jsx"></script>
  <script type="text/babel" src="bs-estrutura.jsx"></script>
  <script type="text/babel" src="bs-publico.jsx"></script>
  <script type="text/babel" src="bs-vagas.jsx"></script>
  <script type="text/babel" src="bs-form.jsx"></script>
  <script type="text/babel" src="bs-cta-footer.jsx"></script>

  <script type="text/babel">
    const App = () => (
      <div className="bs-stage">
        <div className="bs-root">
          <window.BsTopbar />
          <window.BsHero />
          <window.BsManifesto />
          <window.BsSobre />
          <window.BsEstrutura />
          <window.BsPublico />
          <window.BsVagas />
          <window.BsDepoimentos />
          <window.BsCta />
          <window.BsFooter />
        </div>
      </div>
    );

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
