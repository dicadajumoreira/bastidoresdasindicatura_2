# Netlify config — Bastidores da Sindicatura
[build]
  publish = "site"
  functions = "netlify/functions"

# Força Node 20 (Functions v2 com `export default async (req) => Response`
# precisa de Node 18+; 20 é o LTS atual mais estável).
[build.environment]
  NODE_VERSION = "20"
  # Não escaneia arquivos de documentação por "secrets"
  SECRETS_SCAN_OMIT_PATHS = "COMO-PUBLICAR.md,README.md"

# Desabilita TODO post-processing do Netlify (HTML minification,
# bundling, snippet injection, pre-rendering pra bots). Resolve o
# problema do WhatsApp/Facebook receberem HTML truncado sem og:* tags.
[build.processing]
  skip_processing = true

# Bundler explícito para Functions v2
[functions]
  node_bundler = "esbuild"
# Obs.: o agendamento do cron está declarado no próprio arquivo da função
# (export const config = { schedule: ... }) em
# netlify/functions/process-scheduled-broadcasts-background.mjs


# Edge Function que bypassa o pre-renderer do Netlify nas pretty URLs
[[edge_functions]]
  function = "serve-html"
  path = "/"

