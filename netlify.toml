# Netlify config — Bastidores da Sindicatura
[build]
  publish = "site"
  functions = "netlify/functions"
  command = "npm install"

# Não escaneia arquivos de documentação por "secrets"
# (o COMO-PUBLICAR.md pode mencionar variáveis de exemplo)
[build.environment]
  SECRETS_SCAN_OMIT_PATHS = "COMO-PUBLICAR.md,README.md"

# API routes
[[redirects]]
  from = "/api/submit"
  to = "/.netlify/functions/submit"
  status = 200
  force = true

[[redirects]]
  from = "/api/leads"
  to = "/.netlify/functions/leads"
  status = 200
  force = true

[[redirects]]
  from = "/api/update-status"
  to = "/.netlify/functions/update-status"
  status = 200
  force = true

[[redirects]]
  from = "/api/auth"
  to = "/.netlify/functions/auth"
  status = 200
  force = true

# Admin sem trailing slash
[[redirects]]
  from = "/admin"
  to = "/admin/index.html"
  status = 200

# Headers de segurança no admin
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
