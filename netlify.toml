# Rotas de compra desativadas — enquanto a mentoria está em fase de
# APLICAÇÃO (pré-venda), qualquer link antigo pra /comprar-* redireciona
# 301 pro formulário de aplicação na home. Endpoints Stripe e
# páginas /comprar-*/ permanecem no repositório pra reativação futura,
# mas ninguém acessa elas por navegação normal.
[[redirects]]
  from = "/comprar-experience/"
  to = "/#contato"
  status = 301
  force = true

[[redirects]]
  from = "/comprar-experience"
  to = "/#contato"
  status = 301
  force = true

[[redirects]]
  from = "/comprar-executive/"
  to = "/#contato"
  status = 301
  force = true

[[redirects]]
  from = "/comprar-executive"
  to = "/#contato"
  status = 301
  force = true

# Redirect 301 da URL antiga pra preservar links já compartilhados
[[redirects]]
  from = "/sorteio-mba/"
  to = "/mba/"
  status = 301
  force = true

[[redirects]]
  from = "/sorteio-mba"
  to = "/mba/"
  status = 301
  force = true

# As rotas /api/* agora são declaradas via `export const config = { path: ... }`
# em cada function. Mantemos esses redirects como FALLBACK (não-force) caso
# o declarative routing falhe por algum motivo.
[[redirects]]
  from = "/api/submit"
  to = "/.netlify/functions/submit"
  status = 200

[[redirects]]
  from = "/api/leads"
  to = "/.netlify/functions/leads"
  status = 200

[[redirects]]
  from = "/api/update-status"
  to = "/.netlify/functions/update-status"
  status = 200

[[redirects]]
  from = "/api/auth"
  to = "/.netlify/functions/auth"
  status = 200

# Admin sem trailing slash
[[redirects]]
  from = "/admin"
  to = "/admin/index.html"
  status = 200

# /checklist sem barra final aponta para a landing
[[redirects]]
  from = "/checklist"
  to = "/checklist/index.html"
  status = 200


# Força edge a revalidar HTML a cada request (impede bot ver versão stale)
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Netlify-CDN-Cache-Control = "public, max-age=0, must-revalidate"


# Força servir HTML estático sem passar por qualquer interceptação
# (pre-rendering, snippet injection, etc.) — necessário pra bots de
# WhatsApp/Facebook/etc. verem as meta tags og:* corretas.
[[redirects]]
  from = "/"
  to = "/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/checklist/"
  to = "/checklist/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/ebook-ia/"
  to = "/ebook-ia/index.html"
  status = 200
  force = true

# Headers de segurança e cache no admin
# Cache-Control no-cache: força o browser a revalidar com o servidor a cada
# request, evitando que uma versão velha (e potencialmente quebrada) do
# admin.jsx fique presa no cache local.
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Cache-Control = "no-cache, must-revalidate"
    Netlify-CDN-Cache-Control = "no-store"
