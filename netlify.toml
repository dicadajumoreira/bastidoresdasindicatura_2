# Netlify config — Bastidores da Sindicatura
[build]
  publish = "site"
  functions = "netlify/functions"

# Força Node 20 (Functions v2 com `export default async (req) => Response`
# precisa de Node 18+; 20 é o LTS atual mais estável).
[build.environment]
  NODE_VERSION = "20"
  # Não escaneia arquivos de documentação por "secrets"
  SECRETS_SCAN_OMIT_PATHS = "COMO-PUBLICAR.md,README.md"

# Desabilita TODO post-processing do Netlify (HTML minification,
# bundling, snippet injection, pre-rendering pra bots). Resolve o
# problema do WhatsApp/Facebook receberem HTML truncado sem og:* tags.
[build.processing]
  skip_processing = true

# Bundler explícito para Functions v2
[functions]
  node_bundler = "esbuild"


# Edge Function que bypassa o pre-renderer do Netlify nas pretty URLs
[[edge_functions]]
  function = "serve-html"
  path = "/"

[[edge_functions]]
  function = "serve-html"
  path = "/checklist/"

[[edge_functions]]
  function = "serve-html"
  path = "/ebook-ia/"

[[edge_functions]]
  function = "serve-html"
  path = "/sindico-profissional/"

[[edge_functions]]
  function = "serve-html"
  path = "/sobrevivencia-whatsapp/"

[[edge_functions]]
  function = "serve-html"
  path = "/50-frases/"

[[edge_functions]]
  function = "serve-html"
  path = "/nr1/"

[[edge_functions]]
  function = "serve-html"
  path = "/conflitos/"

[[edge_functions]]
  function = "serve-html"
  path = "/saude-mental/"

[[edge_functions]]
  function = "serve-html"
  path = "/gestao-sob-ataque/"

[[edge_functions]]
  function = "serve-html"
  path = "/bombeiro/"

# As rotas /api/* agora são declaradas via `export const config = { path: ... }`
# em cada function. Mantemos esses redirects como FALLBACK (não-force) caso
# o declarative routing falhe por algum motivo.
[[redirects]]
  from = "/api/submit"
  to = "/.netlify/functions/submit"
  status = 200

[[redirects]]
  from = "/api/leads"
  to = "/.netlify/functions/leads"
  status = 200

[[redirects]]
  from = "/api/update-status"
  to = "/.netlify/functions/update-status"
  status = 200

[[redirects]]
  from = "/api/auth"
  to = "/.netlify/functions/auth"
  status = 200

# Admin sem trailing slash
[[redirects]]
  from = "/admin"
  to = "/admin/index.html"
  status = 200

# /checklist sem barra final aponta para a landing
[[redirects]]
  from = "/checklist"
  to = "/checklist/index.html"
  status = 200


# Força edge a revalidar HTML a cada request (impede bot ver versão stale)
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Netlify-CDN-Cache-Control = "public, max-age=0, must-revalidate"


# Força servir HTML estático sem passar por qualquer interceptação
# (pre-rendering, snippet injection, etc.) — necessário pra bots de
# WhatsApp/Facebook/etc. verem as meta tags og:* corretas.
[[redirects]]
  from = "/"
  to = "/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/checklist/"
  to = "/checklist/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/ebook-ia/"
  to = "/ebook-ia/index.html"
  status = 200
  force = true

# Headers de segurança no admin
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
